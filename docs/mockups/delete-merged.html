<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foom Delete Merged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Delete merged worktrees with feedback. The dialog opens at once from the background
   check, or opens checking. Delete turns it into a checklist that can be hidden; the
   sidebar shows the same progress, and rows leave as they finish. Colors are the brand
   tokens; the panel follows .sidebar-panel and the dialog follows confirmation.css. */
:root {
  --bg: #f3f0fa; --surface: #e9e4f5; --line: #ddd6ee; --ink: #14101f; --muted: #625a7a;
  --accent: #5b2bd9; --accent-deep: #3b1a99; --attention: #d98200; --attention-ink: #8c5000;
  --done: #13804a; --done-ink: #0e6b3c; --failed: #d6166e; --failed-ink: #b0105a; --idle: #b9b0d3;
  --badge: #4a4263; --badge-ink: #f4efff; --lift: #ffffff; --hole: #05040a;
  --shadow: rgba(40, 20, 90, .28); --scrim: rgba(20, 16, 31, .28); --solid: #14101f; --solid-ink: #f4efff;
  --term-bg: #05040a; --term-line: #251d3f; --term-ink: #f4efff; --term-dim: #6a6188;
  --display: "Archivo Black", sans-serif;
  --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05040a; --surface: #0d0a17; --line: #251d3f; --ink: #f4efff; --muted: #9d93bd;
    --accent: #9b6bff; --accent-deep: #7a3cff; --attention: #ffb23e; --attention-ink: #ffb23e;
    --done: #6fe0a3; --done-ink: #6fe0a3; --failed: #ff2e88; --failed-ink: #ff2e88; --idle: #4a4263;
    --badge: #3a3060; --badge-ink: #f4efff; --lift: #f4efff; --hole: #000000;
    --shadow: rgba(0, 0, 0, .85); --scrim: rgba(0, 0, 0, .55); --solid: #f4efff; --solid-ink: #14101f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05040a; --surface: #0d0a17; --line: #251d3f; --ink: #f4efff; --muted: #9d93bd;
  --accent: #9b6bff; --accent-deep: #7a3cff; --attention: #ffb23e; --attention-ink: #ffb23e;
  --done: #6fe0a3; --done-ink: #6fe0a3; --failed: #ff2e88; --failed-ink: #ff2e88; --idle: #4a4263;
  --badge: #3a3060; --badge-ink: #f4efff; --lift: #f4efff; --hole: #000000;
  --shadow: rgba(0, 0, 0, .85); --scrim: rgba(0, 0, 0, .55); --solid: #f4efff; --solid-ink: #14101f;
  color-scheme: dark;
}
:root {
  --highlight: var(--accent);
  --highlight-deep: var(--accent-deep);
  --select: color-mix(in srgb, var(--highlight) 18%, var(--surface));
  --raised-top: color-mix(in srgb, var(--surface) 92%, var(--lift));
  --raised-bottom: var(--surface);
  --raised-line: color-mix(in srgb, var(--highlight) 25%, var(--line));
  --raised-hover: color-mix(in srgb, var(--highlight) 12%, var(--raised-top));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--highlight); outline-offset: 1px; }
.frame { height: 100%; overflow-x: auto; }
.app { position: relative; display: flex; height: 100%; min-width: 1100px; min-height: 600px; overflow: hidden; }

/* Sidebar tree slice */
.side { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
.head { padding: 16px 12px 10px; font: 22px/1 var(--display); }
.hole { display: inline-block; width: .52em; height: .52em; margin: 0 .035em; border-radius: 50%; background: var(--hole); box-shadow: 0 0 0 2px var(--accent), 0 0 10px var(--accent); }
.tree { padding: 4px 6px; }
.trow { position: relative; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px; border-radius: 6px; font-size: 13px; overflow: hidden; }
.trow.repo { font-weight: 600; }
.trow.repo.open { background: var(--select); }
.trow .chev { width: 12px; color: var(--muted); font-size: 10px; }
.trow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .more { width: 24px; height: 22px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--muted); }
.trow .more:hover, .trow.open .more { border-color: var(--line); color: var(--ink); }
/* The repository row's progress: a count while deleting, gone when finished. */
.trow .count { font: 500 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.trow.wt { padding-left: 24px; font: 12px var(--mono); color: var(--muted); }
.trow.wt svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; flex-shrink: 0; }
.trow .tag { flex-shrink: 0; font: 11px var(--mono); color: var(--muted); }
/* Queued: still a row, quietly marked. Removing: dimmed, with a slow sweep in the
   highlight. Neither is amber (nothing needs the user) nor magenta (nothing failed). */
.trow.wt[data-state="queued"] .name { opacity: .7; }
.trow.wt[data-state="removing"] .name { opacity: .45; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.trow.wt[data-state="removing"]::after { content: ""; position: absolute; inset: auto 6px 3px 24px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--highlight), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sweep 1.1s linear infinite; }
@keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }
/* Removed: the row folds away. */
.trow.wt.leaving { animation: leave 260ms ease-in forwards; }
@keyframes leave { to { height: 0; opacity: 0; transform: translateX(-8px); } }
/* Kept during the run (changed since the check): stays, with its reason until hovered. */
.trow.wt[data-state="kept"] .tag { color: var(--ink); }
.trow.wt[data-state="error"] .tag { color: var(--failed-ink); }
.trow.wt[data-state="error"] .tag::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 1px; background: var(--failed); vertical-align: 1px; }
.srow { display: flex; gap: 8px; padding: 4px 6px 6px 42px; }
.srow .lines { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.srow .top { font: 12px var(--mono); }
.srow .reason { font-size: 12px; color: var(--muted); }
.light { flex-shrink: 0; width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--idle); }
.light.working { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.badge { flex-shrink: 0; min-width: 24px; height: 20px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; background: var(--badge); color: var(--badge-ink); font: 600 11px var(--mono); }
.area { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
.tile { display: flex; flex-direction: column; background: var(--term-bg); border: 1px solid var(--term-line); border-radius: 6px; overflow: hidden; }
.tb { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-bottom: 1px solid var(--term-line); font: 12px var(--mono); color: var(--term-ink); }
.tb .no { padding: 0 5px; border: 1px solid var(--term-line); border-radius: 4px; color: var(--term-dim); font-size: 10px; }
.term { flex: 1; padding: 10px 12px; font: 12px/1.6 var(--mono); color: var(--term-dim); white-space: pre; }
.term b { color: var(--term-ink); font-weight: 400; }

/* Panel: .row-menu.sidebar-panel */
.panel { position: absolute; z-index: 20; width: 680px; padding: 4px; background: linear-gradient(180deg, var(--raised-top), var(--raised-bottom)); border: 1px solid var(--raised-line); border-radius: 10px; box-shadow: 0 1px 0 rgb(255 255 255 / 5%) inset, 0 22px 48px -12px var(--shadow), 0 8px 16px -8px var(--shadow), 0 0 28px -8px color-mix(in srgb, var(--highlight) 40%, transparent); animation: open 130ms ease-out; }
@keyframes open { from { opacity: 0; transform: translateX(-6px) scale(.98); } }
.panel::before { content: ""; position: absolute; left: -6px; top: 18px; width: 10px; height: 10px; background: var(--raised-top); border-left: 1px solid var(--raised-line); border-bottom: 1px solid var(--raised-line); transform: rotate(45deg); }
.ph { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); border-radius: 7px 7px 0 0; background: linear-gradient(100deg, color-mix(in srgb, var(--highlight) 20%, transparent), color-mix(in srgb, var(--highlight) 6%, transparent) 55%, transparent); }
.ph::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; border-radius: 7px 7px 0 0; background: linear-gradient(90deg, var(--highlight), var(--highlight-deep) 45%, transparent); }
.mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: color-mix(in srgb, var(--highlight) 16%, var(--raised-top)); border: 1px solid color-mix(in srgb, var(--highlight) 35%, var(--line)); }
.mark svg { width: 14px; height: 14px; fill: none; stroke: var(--highlight); stroke-width: 1.2; }
.ptitle { flex: 1; font-weight: 600; }
.kind { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--highlight) 12%, transparent); color: var(--muted); font: 11px var(--mono); }
.pbody { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.cmds { display: flex; flex-direction: column; gap: 1px; padding: 8px 8px 8px 4px; border-right: 1px solid var(--line); border-radius: 0 0 0 7px; background: linear-gradient(180deg, color-mix(in srgb, var(--highlight) 7%, transparent), color-mix(in srgb, var(--highlight) 3%, transparent)); }
.cmds button { position: relative; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 12px; background: transparent; border: 0; border-radius: 6px; text-align: left; font-size: 13px; }
.cmds button:hover, .cmds button:focus-visible { background: var(--raised-hover); outline: none; }
.cmds button::before { content: ""; position: absolute; inset: 8px auto 8px 0; width: 2px; background: var(--highlight); border-radius: 2px; transform: scaleY(0); transition: transform 160ms; }
.cmds button:hover::before, .cmds button:focus-visible::before { transform: scaleY(1); }
.cmds button:disabled { cursor: default; color: var(--muted); }
.cmds button:disabled::before { display: none; }
.cmds .label { flex: 1; }
.cmds .hint { font: 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cmds hr { width: calc(100% - 12px); margin: 4px 6px; border: 0; border-top: 1px solid var(--line); }
.glyph { display: grid; place-items: center; width: 24px; color: var(--muted); }
.glyph svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.facts { display: grid; grid-template-columns: 100px minmax(0, 1fr); align-content: start; gap: 9px 16px; margin: 0; padding: 14px 18px 16px 20px; }
.facts dt { padding-top: 2px; font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }
.facts .sub { color: var(--muted); }

/* The trusted dialog window (confirmation.css), drawn here over a scrim. */
.scrim { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--scrim); animation: fade 160ms ease both; }
.scrim[hidden] { display: none; }
.window { width: 460px; max-height: 76vh; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--raised-top), var(--raised-bottom)); border: 1px solid var(--raised-line); border-radius: 12px; box-shadow: 0 30px 70px -20px var(--shadow), 0 0 40px -12px color-mix(in srgb, var(--accent) 40%, transparent); animation: rise 200ms cubic-bezier(.2, .8, .2, 1) both; }
.window h2 { display: flex; align-items: baseline; gap: 10px; margin: 0; padding: 20px 22px 4px; font: 600 16px var(--sans); }
.window h2 .of { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.window .body { padding: 8px 22px 4px; overflow: auto; }
.window .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 20px; }
.window .actions button { height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: transparent; }
.window .actions .commit { background: var(--solid); border-color: var(--solid); color: var(--solid-ink); font-weight: 600; }
.window .actions button:disabled { opacity: .45; cursor: default; }
/* The step line: what Foom is doing right now, before or between rows. */
.step { display: flex; align-items: center; gap: 8px; min-height: 20px; margin: 0 0 8px; font: 12px var(--mono); color: var(--muted); }
.step[hidden] { display: none; }
.spin { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--highlight) 25%, transparent); border-top-color: var(--highlight); animation: turn .8s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
/* Bar: the share of the work done, in the highlight. */
.bar { height: 2px; margin: 0 0 10px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--highlight); transition: width 300ms ease; }
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
.list li { display: flex; align-items: center; gap: 10px; height: 26px; font: 12px var(--mono); }
.list .ic { width: 14px; display: grid; place-items: center; flex-shrink: 0; color: var(--muted); }
.list .ic .spin { width: 11px; height: 11px; }
.list .b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .why { flex-shrink: 0; color: var(--muted); }
.list li[data-state="removed"] .b { color: var(--muted); }
.list li[data-state="removed"] .ic { color: var(--done-ink); }
.list li[data-state="kept"] .why { color: var(--ink); }
.list li[data-state="error"] .why { color: var(--failed-ink); }
.list li[data-state="error"] .ic::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: var(--failed); }
.list li[data-state="checking"] .b { color: var(--muted); }
.sep { margin: 10px 0 6px; font: 11px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.sep[hidden] { display: none; }
/* Placeholder rows while the dialog opens checking. */
.ghostrow { height: 10px; margin: 8px 0; border-radius: 3px; background: linear-gradient(90deg, var(--line), color-mix(in srgb, var(--line) 40%, transparent), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }

.toast { position: absolute; left: 304px; bottom: 16px; z-index: 50; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; color: var(--muted); animation: fade 160ms ease both; }

@media (prefers-reduced-motion: reduce) {
  .panel, .scrim, .window, .trow.wt.leaving { animation: none; }
  .trow.wt[data-state="removing"]::after { animation: none; background: var(--highlight); background-size: 100% 100%; opacity: .5; }
  .spin { animation: none; border-color: var(--highlight); }
  .ghostrow { animation: none; }
}

/* Mockup controls, not product UI. */
.mock { position: absolute; right: 14px; bottom: 12px; z-index: 60; display: flex; gap: 14px; align-items: center; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 6px; background: var(--surface); font: 11px var(--mono); color: var(--muted); }
.mock label { display: flex; gap: 6px; align-items: center; }
.mock select, .mock button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div class="frame">
<div class="app" id="app">
  <aside class="side">
    <div class="head">fo<span class="hole"></span>m</div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="area">
    <section class="tile"><div class="tb"><span class="no">1</span>codex/issue-246</div><div class="term"><b>$ npm run check</b>
 ✓ format   ✓ lint   ✓ typecheck</div></section>
    <section class="tile"><div class="tb"><span class="no">2</span>main</div><div class="term"><b>$</b> </div></section>
  </main>
  <div class="scrim" id="scrim" hidden><div class="window" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" id="dialog"></div></div>
  <div id="toast-slot"></div>
  <div class="mock" aria-label="Mockup controls">
    <label>Background check <select id="m-cache"><option value="fresh">fresh (opens at once)</option><option value="stale">stale (opens checking)</option></select></label>
    <button id="m-reset">Reset</button>
    <label>Theme <select id="m-theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </div>
</div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const G = {
  branch: '<circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="5" r="1.5"/><path d="M4.5 5v6M11.5 6.5c0 2.6-4 2.3-6.4 4.6"/>',
  pin: '<path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5"/>',
  unlist: '<circle cx="8" cy="8" r="5.5"/><path d="M5.5 8h5"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5M7 7v4M9 7v4"/>',
};
const WT = '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="3" cy="2.5" r="1.3"/><circle cx="3" cy="9.5" r="1.3"/><circle cx="9" cy="4" r="1.3"/><path d="M3 3.8v4.4M9 5.3c0 2-3 1.7-5.6 3.3"/></svg>';
const glyph = (n) => `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16">${G[n]}</svg></span>`;
const CHECK = '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 6.5l2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* What main reports. `ms` is how long removal takes (node_modules makes it slow);
   `later` is what the fresh check after Delete finds. */
const INITIAL = [
  { b: "main", main: true, why: "main checkout" },
  { b: "codex/issue-246", why: "running" },
  { b: "codex/issue-235", ms: 1800 },
  { b: "codex/issue-221", ms: 2600 },
  { b: "codex/issue-155", ms: 3400 },
  { b: "docs/delete-merged-mockup", why: "not merged" },
  { b: "codex/issue-231", ms: 2100 },
  { b: "codex/issue-238", ms: 1500, later: "changes · kept" },
  { b: "docs/app-menu-mockup", ms: 1200 },
  { b: "fix/scale-placement", why: "uncommitted changes" },
  { b: "codex/issue-226", ms: 2900 },
  { b: "codex/issue-215", ms: 2300 },
];
const PARALLEL = 4;
let rows, run, timers = [];

function reset() {
  for (const t of timers) clearTimeout(t);
  timers = [];
  rows = INITIAL.map((r) => ({ ...r, state: r.why ? "" : "candidate" }));
  run = null;
  hideDialog();
  closePanel();
  tree();
}
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const candidates = () => rows.filter((r) => r.state && r.state !== "gone" && !r.why);

/* Sidebar */
function tree() {
  const n = run ? `${run.done}/${run.total}` : "";
  $("#tree").innerHTML = `<div class="trow repo" id="repo-row"><span class="chev">▾</span><span class="name">foom</span>${
    run && !run.finished ? `<span class="count" role="status" aria-label="Deleting ${run.done} of ${run.total}">deleting ${n}</span>` : ""
  }<button class="more" id="more" aria-label="foom details and commands" aria-haspopup="dialog" title="Commands">⋯</button></div>`
    + rows.filter((r) => r.state !== "gone").map((r) => `<div class="trow wt${r.state === "removed" ? " leaving" : ""}" data-b="${esc(r.b)}" data-state="${sideState(r)}">${WT}<span class="name">${r.main ? `Main checkout · ${r.b}` : esc(r.b)}</span>${sideTag(r)}</div>${
      r.b === "codex/issue-246" ? '<div class="srow"><span class="light working"></span><span class="badge">CX</span><div class="lines"><div class="top">codex/issue-246</div><div class="reason">Running npm run check</div></div></div>' : ""}`).join("");
  $("#more").addEventListener("click", () => (panelOpen() ? closePanel() : openPanel()));
  for (const el of document.querySelectorAll('.trow.wt[data-state="kept"], .trow.wt[data-state="error"]'))
    el.addEventListener("pointerenter", () => {
      const r = rows.find((x) => x.b === el.dataset.b);
      later(() => { r.state = "settled"; tree(); }, 600);
    }, { once: true });
}
function sideState(r) {
  if (!run) return "";
  return { waiting: "queued", removing: "removing", kept: "kept", error: "error" }[r.state] ?? "";
}
function sideTag(r) {
  if (!run) return "";
  if (r.state === "waiting") return '<span class="tag">queued</span>';
  if (r.state === "kept" || r.state === "error") return `<span class="tag">${esc(r.reason)}</span>`;
  return "";
}

/* The repository panel */
const panelOpen = () => Boolean($("#panel"));
function openPanel() {
  closePanel();
  const row = $("#repo-row"), r = row.getBoundingClientRect(), a = app.getBoundingClientRect();
  const count = run && !run.finished ? `${run.done}/${run.total}` : String(candidates().length);
  app.insertAdjacentHTML("beforeend", `<div class="panel" id="panel" role="dialog" aria-label="foom details and commands">
    <div class="ph"><span class="mark"><svg viewBox="0 0 12 12"><path d="M2 2.5h8v7H2zM2 5h8"/></svg></span><span class="ptitle">foom</span><span class="kind">Repository</span></div>
    <div class="pbody">
      <div class="cmds" role="menu" aria-label="Commands">
        <button role="menuitem">${glyph("branch")}<span class="label">New worktree</span></button>
        <hr>
        <button role="menuitem">${glyph("pin")}<span class="label">Pin to top</span></button>
        <button role="menuitem">${glyph("unlist")}<span class="label">Remove from Foom…</span><span class="hint">keeps files</span></button>
        <hr>
        ${run && !run.finished
          ? `<button role="menuitem" id="dm">${glyph("trash")}<span class="label">Deleting merged worktrees</span><span class="hint">${count}</span></button>`
          : `<button role="menuitem" id="dm" ${candidates().length ? "" : "disabled"}>${glyph("trash")}<span class="label">Delete merged worktrees…</span><span class="hint">${candidates().length || ""}</span></button>`}
      </div>
      <div class="right">
        <dl class="facts">
          <dt>Path</dt><dd>/var/www/html/scott/foom</dd>
          <dt>Remote</dt><dd>github.com/scott-r-lindsey/foom</dd>
          <dt>Default branch</dt><dd>main <span class="sub">· fetched ${$("#m-cache").value === "fresh" ? "20 s" : "6 min"} ago</span></dd>
          <dt>Worktrees</dt><dd>${rows.filter((x) => x.state !== "gone" && !x.main).length} <span class="sub">· ${candidates().length} eligible to delete</span></dd>
        </dl>
      </div>
    </div>
  </div>`);
  const p = $("#panel");
  p.style.left = `${r.right - a.left + 10}px`;
  p.style.top = `${r.top - a.top - 6}px`;
  $("#repo-row").classList.add("open");
  $("#dm").addEventListener("click", () => { closePanel(); run && !run.finished ? showDialog() : confirmDialog(); });
  p.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closePanel(); $("#more").focus(); }
    const bs = [...p.querySelectorAll(".cmds button:not(:disabled)")], i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
  });
  $("#dm").focus();
}
function closePanel() { $("#panel")?.remove(); $("#repo-row")?.classList.remove("open"); }

/* Step 1: the dialog opens on click. A background check under a minute old fills it at
   once; otherwise it opens checking, with Delete disabled until the list is known. */
function confirmDialog() {
  const fresh = $("#m-cache").value === "fresh";
  const d = $("#dialog");
  d.innerHTML = `<h2 id="dlg-title">Delete merged worktrees?</h2>
    <div class="body" id="dbody">
      <p class="step" id="step" role="status"${fresh ? " hidden" : ""}><span class="spin" aria-hidden="true"></span><span id="step-text">Fetching origin…</span></p>
      <div id="dlist">${fresh ? planList() : '<div class="ghostrow" style="width:70%"></div><div class="ghostrow" style="width:55%"></div><div class="ghostrow" style="width:62%"></div>'}</div>
    </div>
    <div class="actions"><button type="button" data-act="cancel">Cancel</button><button type="button" class="commit" data-act="delete" ${fresh ? "" : "disabled"}>${fresh ? `Delete ${candidates().length}` : "Delete"}</button></div>`;
  $("#scrim").hidden = false;
  if (fresh) { $('[data-act="delete"]').focus(); return; }
  $('[data-act="cancel"]').focus();
  later(() => { if ($("#step-text")) $("#step-text").textContent = `Checking ${rows.length - 1} worktrees…`; }, 900);
  later(() => {
    if (!$("#dlist")) return;
    $("#step").hidden = true;
    $("#dlist").innerHTML = planList();
    const del = $('[data-act="delete"]');
    del.disabled = false;
    del.textContent = `Delete ${candidates().length}`;
    del.focus();
  }, 1500);
}
function planList() {
  const go = rows.filter((r) => r.state === "candidate"), kept = rows.filter((r) => r.why);
  return `<ul class="list" aria-label="Worktrees to delete">${go.map((r) => `<li><span class="ic" aria-hidden="true">·</span><span class="b">${esc(r.b)}</span></li>`).join("")}</ul>
    <div class="sep">Kept</div>
    <ul class="list" aria-label="Kept worktrees">${kept.map((r) => `<li><span class="ic" aria-hidden="true">–</span><span class="b">${esc(r.b)}</span><span class="why">${esc(r.why)}</span></li>`).join("")}</ul>`;
}

/* Step 2: Delete. A fresh fetch, then up to four removals at a time. The dialog becomes
   the checklist; Hide leaves it running in the sidebar; Stop finishes the ones in flight
   and leaves the rest. */
function start() {
  const list = candidates();
  run = { total: list.length, done: 0, active: 0, queue: [...list], stopped: false, finished: false, hidden: false };
  for (const r of list) r.state = "waiting";
  run.phase = "fetch";
  tree();
  showDialog();
  later(() => { run.phase = "remove"; pump(); }, 1000);
}
function pump() {
  while (!run.stopped && run.active < PARALLEL && run.queue.length) {
    const r = run.queue.shift();
    r.state = "removing";
    run.active++;
    later(() => finish(r), r.ms);
  }
  if (!run.active && (!run.queue.length || run.stopped)) {
    run.finished = true;
    for (const r of run.queue) r.state = "candidate";
  }
  tree();
  render();
}
function finish(r) {
  run.active--;
  run.done++;
  if (r.later) { r.state = "kept"; r.reason = r.later; r.why = "changes since check"; }
  else {
    r.state = "removed";
    later(() => { r.state = "gone"; tree(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 260);
  }
  pump();
}

function showDialog() {
  run.hidden = false;
  $("#scrim").hidden = false;
  render();
  $('[data-act="hide"], [data-act="done"]')?.focus();
}
function render() {
  if (!run || run.hidden) return;
  const all = rows.filter((r) => ["waiting", "removing", "removed", "gone", "kept", "error"].includes(r.state) || (run.finished && r.state === "candidate" && run.stopped));
  const removed = rows.filter((r) => r.state === "removed" || r.state === "gone").length;
  const kept = rows.filter((r) => r.state === "kept").length;
  const icon = (r) => r.state === "removing" ? '<span class="spin"></span>' : r.state === "removed" || r.state === "gone" ? CHECK : r.state === "kept" ? "–" : "·";
  const word = (r) => ({ waiting: "queued", removing: "removing", removed: "removed", gone: "removed", kept: r.reason, error: r.reason, candidate: "not started" })[r.state];
  const title = run.finished ? (run.stopped ? `Stopped after ${removed}` : `Deleted ${removed} worktrees`) : "Deleting merged worktrees";
  const step = run.finished
    ? (kept ? `${kept} kept: changed since the check` : "")
    : run.phase === "fetch" ? "Fetching origin…" : run.stopped ? "Finishing the ones in progress…" : "";
  $("#dialog").innerHTML = `<h2 id="dlg-title">${title}<span class="of">${run.done}/${run.total}</span></h2>
    <div class="body">
      <div class="bar" aria-hidden="true"><i style="width:${(100 * run.done) / run.total}%"></i></div>
      <p class="step" role="status"${step ? "" : " hidden"}>${run.finished ? "" : '<span class="spin" aria-hidden="true"></span>'}<span>${step}</span></p>
      <ul class="list" aria-label="Progress">${all.map((r) => `<li data-state="${r.state === "gone" ? "removed" : r.state}"><span class="ic" aria-hidden="true">${icon(r)}</span><span class="b">${esc(r.b)}</span><span class="why">${esc(word(r))}</span></li>`).join("")}</ul>
    </div>
    <div class="actions">${run.finished
      ? '<button type="button" class="commit" data-act="done">Done</button>'
      : `<button type="button" data-act="stop" ${run.stopped ? "disabled" : ""}>Stop</button><button type="button" class="commit" data-act="hide">Hide</button>`}</div>`;
  if (run.finished && !$("#scrim").hidden) $('[data-act="done"]').focus();
}
function hideDialog() { $("#scrim").hidden = true; if (run) run.hidden = true; }
function toast(text) {
  const t = $("#toast-slot");
  t.innerHTML = `<div class="toast" role="status">${text}</div>`;
  later(() => { t.innerHTML = ""; }, 2400);
}

$("#scrim").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "cancel") hideDialog();
  else if (act === "delete") start();
  else if (act === "hide") hideDialog();
  else if (act === "stop") { run.stopped = true; run.queue.forEach((r) => (r.state = "candidate")); pump(); }
  else if (act === "done") { hideDialog(); run = null; tree(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("#scrim").hidden) return;
  // Escape hides a running dialog and cancels a confirmation; it never stops removals.
  if (run?.finished) { hideDialog(); run = null; tree(); } else hideDialog();
});
document.addEventListener("pointerdown", (e) => { if (panelOpen() && !e.target.closest(".panel, #more")) closePanel(); });
/* When a hidden run finishes, the count leaves the repository row and a toast reports it. */
const watch = setInterval(() => {
  if (run?.finished && run.hidden && !run.reported) {
    run.reported = true;
    const removed = rows.filter((r) => r.state === "removed" || r.state === "gone").length;
    const kept = rows.filter((r) => r.state === "kept").length;
    toast(`Deleted ${removed} merged worktrees${kept ? ` · ${kept} kept` : ""}`);
    tree();
  }
}, 200);
$("#m-reset").addEventListener("click", reset);
$("#m-theme").addEventListener("change", (e) => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; });
reset();
openPanel();
</script>
</body>
</html>
