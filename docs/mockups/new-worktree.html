<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foom New Worktree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* New worktree without a dialog: choosing New worktree in a repository's panel puts a
   field next to it, in the same panel. Enter creates the worktree and starts nothing; the
   panel closes and the new row arrives in the sidebar. Colors are the brand tokens; the panel
   follows .sidebar-panel in src/renderer/styles/board.css. */
:root {
  --bg: #f3f0fa; --surface: #e9e4f5; --line: #ddd6ee; --ink: #14101f; --muted: #625a7a;
  --accent: #5b2bd9; --accent-deep: #3b1a99; --attention: #d98200; --attention-ink: #8c5000;
  --done: #13804a; --done-ink: #0e6b3c; --failed: #d6166e; --failed-ink: #b0105a; --idle: #b9b0d3;
  --badge: #4a4263; --badge-ink: #f4efff; --lift: #ffffff; --hole: #05040a;
  --shadow: rgba(40, 20, 90, .28);
  --term-bg: #05040a; --term-line: #251d3f; --term-ink: #f4efff; --term-dim: #6a6188; --term-acc: #c08bff;
  --display: "Archivo Black", sans-serif;
  --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05040a; --surface: #0d0a17; --line: #251d3f; --ink: #f4efff; --muted: #9d93bd;
    --accent: #9b6bff; --accent-deep: #7a3cff; --attention: #ffb23e; --attention-ink: #ffb23e;
    --done: #6fe0a3; --done-ink: #6fe0a3; --failed: #ff2e88; --failed-ink: #ff2e88; --idle: #4a4263;
    --badge: #3a3060; --badge-ink: #f4efff; --lift: #f4efff; --hole: #000000;
    --shadow: rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05040a; --surface: #0d0a17; --line: #251d3f; --ink: #f4efff; --muted: #9d93bd;
  --accent: #9b6bff; --accent-deep: #7a3cff; --attention: #ffb23e; --attention-ink: #ffb23e;
  --done: #6fe0a3; --done-ink: #6fe0a3; --failed: #ff2e88; --failed-ink: #ff2e88; --idle: #4a4263;
  --badge: #3a3060; --badge-ink: #f4efff; --lift: #f4efff; --hole: #000000;
  --shadow: rgba(0, 0, 0, .85);
  color-scheme: dark;
}
:root {
  --highlight: var(--accent);
  --highlight-deep: var(--accent-deep);
  --select: color-mix(in srgb, var(--highlight) 18%, var(--surface));
  --raised-top: color-mix(in srgb, var(--surface) 92%, var(--lift));
  --raised-bottom: var(--surface);
  --raised-line: color-mix(in srgb, var(--highlight) 25%, var(--line));
  --raised-hover: color-mix(in srgb, var(--highlight) 12%, var(--raised-top));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--highlight); outline-offset: 1px; }
.frame { height: 100%; overflow-x: auto; }
.app { position: relative; display: flex; height: 100%; min-width: 1100px; overflow: hidden; }

/* Sidebar tree slice */
.side { width: 270px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
.head { padding: 16px 12px 10px; font: 22px/1 var(--display); }
.hole { display: inline-block; width: .52em; height: .52em; margin: 0 .035em; border-radius: 50%; background: var(--hole); box-shadow: 0 0 0 2px var(--accent), 0 0 10px var(--accent); }
.tree { padding: 4px 6px; }
.trow { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px; border-radius: 6px; font-size: 13px; }
.trow.repo { font-weight: 600; }
.trow.repo.open { background: var(--select); }
.trow .chev { width: 12px; color: var(--muted); font-size: 10px; }
.trow .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .more { width: 24px; height: 22px; padding: 0; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--muted); }
.trow .more:hover, .trow.open .more { border-color: var(--line); color: var(--ink); }
.trow.wt { padding-left: 24px; font: 12px var(--mono); color: var(--muted); }
.trow.wt svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; flex-shrink: 0; }
.trow.wt:focus-visible { outline-offset: -2px; }
/* Arrival: the row opens its own space, then flares twice in the accent and keeps a quiet
   tint and edge until it is hovered or focused. Not amber: nothing needs the user yet. */
.trow.wt.fresh { position: relative; color: var(--ink); background: var(--select); box-shadow: inset 2px 0 0 var(--highlight); animation: arrive 220ms cubic-bezier(.2, .8, .2, 1) both, flare 900ms ease-out 220ms 2; }
.trow.wt.fresh::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--highlight) 45%, transparent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: sweep 700ms ease-out 220ms both; pointer-events: none; }
.trow.wt.fresh svg { color: var(--highlight); }
@keyframes arrive { from { height: 0; opacity: 0; transform: translateX(-10px); } }
@keyframes flare { 0% { box-shadow: inset 2px 0 0 var(--highlight), 0 0 0 0 color-mix(in srgb, var(--highlight) 55%, transparent); } 100% { box-shadow: inset 2px 0 0 var(--highlight), 0 0 0 8px transparent; } }
@keyframes sweep { from { background-position: -100% 0; } to { background-position: 200% 0; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .trow.wt.fresh, .trow.wt.fresh::after { animation: none; } }
.srow { display: flex; gap: 8px; padding: 4px 6px 6px 42px; }
.srow .lines { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.srow .top { font: 12px var(--mono); }
.srow .reason { font-size: 12px; color: var(--muted); }
.light { flex-shrink: 0; width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--idle); }
.light.working { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.badge { flex-shrink: 0; min-width: 24px; height: 20px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 3px; background: var(--badge); color: var(--badge-ink); font: 600 11px var(--mono); }
.area { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
.tile { display: flex; flex-direction: column; background: var(--term-bg); border: 1px solid var(--term-line); border-radius: 6px; overflow: hidden; }
.tile.focus { border-color: var(--term-acc); }
.tb { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-bottom: 1px solid var(--term-line); font: 12px var(--mono); color: var(--term-ink); }
.tb .no { padding: 0 5px; border: 1px solid var(--term-line); border-radius: 4px; color: var(--term-dim); font-size: 10px; }
.term { flex: 1; padding: 10px 12px; font: 12px/1.6 var(--mono); color: var(--term-dim); white-space: pre; }
.term b { color: var(--term-ink); font-weight: 400; }

/* Panel: .row-menu.sidebar-panel */
.panel { position: absolute; z-index: 20; width: 720px; padding: 4px; background: linear-gradient(180deg, var(--raised-top), var(--raised-bottom)); border: 1px solid var(--raised-line); border-radius: 10px; box-shadow: 0 1px 0 rgb(255 255 255 / 5%) inset, 0 22px 48px -12px var(--shadow), 0 8px 16px -8px var(--shadow), 0 0 28px -8px color-mix(in srgb, var(--highlight) 40%, transparent); animation: open 130ms ease-out; }
@keyframes open { from { opacity: 0; transform: translateX(-6px) scale(.98); } }
.panel::before { content: ""; position: absolute; left: -6px; top: 18px; width: 10px; height: 10px; background: var(--raised-top); border-left: 1px solid var(--raised-line); border-bottom: 1px solid var(--raised-line); transform: rotate(45deg); }
.ph { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); border-radius: 7px 7px 0 0; background: linear-gradient(100deg, color-mix(in srgb, var(--highlight) 20%, transparent), color-mix(in srgb, var(--highlight) 6%, transparent) 55%, transparent); }
.ph::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; border-radius: 7px 7px 0 0; background: linear-gradient(90deg, var(--highlight), var(--highlight-deep) 45%, transparent); }
.mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: color-mix(in srgb, var(--highlight) 16%, var(--raised-top)); border: 1px solid color-mix(in srgb, var(--highlight) 35%, var(--line)); }
.mark svg { width: 14px; height: 14px; fill: none; stroke: var(--highlight); stroke-width: 1.2; }
.ptitle { flex: 1; font-weight: 600; }
.kind { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--highlight) 12%, transparent); color: var(--muted); font: 11px var(--mono); }
.pbody { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.cmds { display: flex; flex-direction: column; gap: 1px; padding: 8px 8px 8px 4px; border-right: 1px solid var(--line); border-radius: 0 0 0 7px; background: linear-gradient(180deg, color-mix(in srgb, var(--highlight) 7%, transparent), color-mix(in srgb, var(--highlight) 3%, transparent)); }
.cmds button { position: relative; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 12px; background: transparent; border: 0; border-radius: 6px; text-align: left; font-size: 13px; }
.cmds button:hover, .cmds button:focus-visible, .cmds button[aria-expanded="true"] { background: var(--raised-hover); outline: none; }
.cmds button::before { content: ""; position: absolute; inset: 8px auto 8px 0; width: 2px; background: var(--highlight); border-radius: 2px; transform: scaleY(0); transition: transform 160ms; }
.cmds button:hover::before, .cmds button:focus-visible::before, .cmds button[aria-expanded="true"]::before { transform: scaleY(1); }
.cmds .label { flex: 1; }
.cmds .hint { font: 11px var(--mono); color: var(--muted); }
.cmds hr { width: calc(100% - 12px); margin: 4px 6px; border: 0; border-top: 1px solid var(--line); }
.glyph { display: grid; place-items: center; width: 24px; color: var(--muted); }
.glyph svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.right { position: relative; min-width: 0; }
.facts { display: grid; grid-template-columns: 100px minmax(0, 1fr); align-content: start; gap: 9px 16px; margin: 0; padding: 14px 18px 16px 20px; }
.facts dt { padding-top: 2px; font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; }
.facts .sub { color: var(--muted); }
.right.busy .facts { visibility: hidden; }

/* The field, beside New worktree */
.nw { position: absolute; z-index: 1; left: 12px; right: 12px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.box { position: relative; display: flex; align-items: center; height: 34px; background: var(--bg); border: 1px solid var(--highlight); border-radius: 6px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--highlight) 18%, transparent); }
.box.invalid { border-color: var(--failed); box-shadow: 0 0 0 3px color-mix(in srgb, var(--failed) 15%, transparent); }
.box input { position: relative; flex: 1; min-width: 0; height: 100%; padding: 0 10px; background: transparent; border: 0; outline: none; font: 13px var(--mono); }
.ghost { position: absolute; inset: 0; padding: 0 10px; display: flex; align-items: center; font: 13px var(--mono); white-space: pre; pointer-events: none; overflow: hidden; }
.ghost .typed { color: transparent; }
.ghost .rest { color: var(--muted); opacity: .65; }
.ghost .other { margin-left: auto; color: var(--muted); opacity: .8; }
.what { display: flex; align-items: center; gap: 6px; min-height: 18px; padding: 0 2px; font: 11px var(--mono); color: var(--muted); }
.what .new { color: var(--accent); }
.what.err { font: 12px var(--sans); color: var(--failed-ink); }
.what.err::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: var(--failed); }

/* Mockup controls, not product UI. */
.mock { position: absolute; right: 14px; bottom: 12px; z-index: 50; display: flex; gap: 14px; align-items: center; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 6px; background: var(--surface); font: 11px var(--mono); color: var(--muted); }
.mock label { display: flex; gap: 6px; align-items: center; }
.mock select, .mock button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
.note { position: absolute; left: 284px; bottom: 16px; font: 11px var(--mono); color: var(--term-dim); }
</style>
</head>
<body>
<div class="frame">
<div class="app" id="app">
  <aside class="side">
    <div class="head">fo<span class="hole"></span>m</div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="area">
    <section class="tile focus"><div class="tb"><span class="no">1</span>codex/issue-226</div><div class="term"><b>$ npm run check</b>
 ✓ format   ✓ lint   ✓ typecheck</div></section>
    <section class="tile" id="t2"><div class="tb"><span class="no">2</span>docs/environment-mockup</div><div class="term"><b>● Turn ended.</b></div></section>
  </main>
  <div class="note">⋯ on a repository, or ⌘T / Ctrl+Shift+T for the focused tile's repository.</div>
  <div class="mock" aria-label="Mockup controls">
    <button id="m-reset">Reset</button>
    <label>Theme <select id="m-theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </div>
</div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const G = {
  branch: '<circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="5" r="1.5"/><path d="M4.5 5v6M11.5 6.5c0 2.6-4 2.3-6.4 4.6"/>',
  pin: '<path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5"/>',
  unlist: '<circle cx="8" cy="8" r="5.5"/><path d="M5.5 8h5"/>',
  trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5M7 7v4M9 7v4"/>',
};
const WT = '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="3" cy="2.5" r="1.3"/><circle cx="3" cy="9.5" r="1.3"/><circle cx="9" cy="4" r="1.3"/><path d="M3 3.8v4.4M9 5.3c0 2-3 1.7-5.6 3.3"/></svg>';
const glyph = (n) => `<span class="glyph" aria-hidden="true"><svg viewBox="0 0 16 16">${G[n]}</svg></span>`;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* What main would report for the repository. */
const REPO = {
  head: "main",
  local: {
    main: "foom", "codex/issue-226": "foom-226", "docs/environment-mockup": "foom-app-menu",
    "codex/issue-215": null, "codex/issue-217": "foom-217", "codex/issue-220": "foom-220",
    "codex/200-clean-packaging": "foom-200", "codex/issue-207": null, "codex/issue-211": null,
    "docs/app-menu-mockup": null, "docs/tile-panels-mockup": null, "fix/sidebar-panel-visuals": "foom-panel-visuals",
    "fix/bare-repo-hook": null, "spike/159-herdr-backend": "foom-herdr-spike",
  },
  remote: ["codex/issue-221", "codex/issue-222"],
};
const CONVENTIONAL = ["feat/", "fix/", "chore/", "docs/", "refactor/", "test/", "ci/"];
const worktrees = [["main", "Main checkout"], ["codex/issue-226", null], ["docs/environment-mockup", null]];
let fresh = "";

function tree() {
  $("#tree").innerHTML = `<div class="trow repo" id="repo-row"><span class="chev">▾</span><span class="name">foom</span><button class="more" id="more" aria-label="foom commands" aria-haspopup="dialog" title="Commands">⋯</button></div>`
    + worktrees.map(([b, main]) => `<div class="trow wt${b === fresh ? " fresh" : ""}" tabindex="-1" data-b="${esc(b)}">${WT}<span class="name">${main ? `${main} · ${b}` : esc(b)}</span></div>${
      b === "codex/issue-226" ? '<div class="srow"><span class="light working"></span><span class="badge">CX</span><div class="lines"><div class="top">codex/issue-226</div><div class="reason">Running npm run check</div></div></div>' : ""}`).join("");
  $("#more").addEventListener("click", () => (panelOpen() ? closePanel() : openPanel()));
  const f = $(".trow.wt.fresh");
  if (f) for (const ev of ["pointerenter", "blur"]) f.addEventListener(ev, settle, { once: true });
}

/* Completion candidates: the repository's own prefixes first, then its branches. */
function prefixes() {
  const counts = {};
  for (const b of [...Object.keys(REPO.local), ...REPO.remote]) {
    const m = b.match(/^([^/]+\/)/);
    if (m) counts[m[1]] = (counts[m[1]] ?? 0) + 1;
  }
  const used = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([p]) => p);
  return used.length ? used : CONVENTIONAL;
}
function candidates(t) {
  const branches = [...Object.keys(REPO.local).filter((b) => b !== REPO.head), ...REPO.remote];
  const starts = [...(t.includes("/") ? [] : prefixes()), ...branches].filter((c) => c.startsWith(t) && c !== t);
  const inside = t ? branches.filter((c) => !c.startsWith(t) && c.toLowerCase().includes(t.toLowerCase())) : [];
  return [...starts, ...inside];
}
/* What Enter would do with exactly this name. */
function outcome(t) {
  if (!t) return null;
  const p = problem(t);
  if (p) return { err: p };
  if (t.endsWith("/")) return { text: "" };
  if (REPO.local[t] !== undefined) return REPO.local[t] ? { text: `open in ${REPO.local[t]}`, kind: "open" } : { text: "existing", kind: "existing" };
  if (REPO.remote.includes(t)) return { text: "from origin", kind: "origin" };
  return { text: `new, from ${REPO.head}`, kind: "new" };
}
function problem(b) {
  if (/^-/.test(b)) return "Can't start with -";
  if (/\.\./.test(b)) return "Can't contain ..";
  if (/[~^:?*[\\\x00-\x20\x7f]/.test(b)) return "Can't contain ~ ^ : ? * [ or \\";
  if (/@\{/.test(b)) return "Can't contain @{";
  if (/\/\/|^\/|\/\.|^\./.test(b)) return "Each part needs a name and can't start with .";
  if (/\.lock$|\.$/.test(b)) return "Can't end with . or .lock";
  return "";
}

/* The repository panel, as today */
const panelOpen = () => Boolean($("#panel"));
function openPanel(withField) {
  closePanel();
  const row = $("#repo-row"), r = row.getBoundingClientRect(), a = app.getBoundingClientRect();
  app.insertAdjacentHTML("beforeend", `<div class="panel" id="panel" role="dialog" aria-label="foom">
    <div class="ph"><span class="mark"><svg viewBox="0 0 12 12"><path d="M2 2.5h8v7H2zM2 5h8"/></svg></span><span class="ptitle">foom</span><span class="kind">Repository</span></div>
    <div class="pbody">
      <div class="cmds" role="menu" aria-label="Commands">
        <button role="menuitem" id="nw-item" aria-haspopup="true" aria-expanded="false">${glyph("branch")}<span class="label">New worktree</span></button>
        <hr>
        <button role="menuitem">${glyph("pin")}<span class="label">Pin to top</span></button>
        <button role="menuitem">${glyph("unlist")}<span class="label">Remove from Foom…</span><span class="hint">keeps files</span></button>
        <hr>
        <button role="menuitem">${glyph("trash")}<span class="label">Delete merged worktrees…</span><span class="hint">3</span></button>
      </div>
      <div class="right" id="right">
        <dl class="facts">
          <dt>Path</dt><dd>/var/www/html/scott/foom</dd>
          <dt>Remote</dt><dd>github.com/scott-r-lindsey/foom</dd>
          <dt>Default branch</dt><dd>main <span class="sub">· fetched 4 min ago</span></dd>
          <dt>Worktrees</dt><dd>${worktrees.length - 1} <span class="sub">· 3 eligible to delete</span></dd>
        </dl>
      </div>
    </div>
  </div>`);
  const p = $("#panel");
  p.style.left = `${r.right - a.left + 10}px`;
  p.style.top = `${r.top - a.top - 6}px`;
  $("#repo-row").classList.add("open");
  $("#nw-item").addEventListener("click", () => field());
  p.addEventListener("keydown", panelKeys);
  if (withField) field(); else $("#nw-item").focus();
}
function closePanel() {
  $("#panel")?.remove();
  $("#repo-row")?.classList.remove("open");
}
function panelKeys(e) {
  if (e.key === "Escape") {
    e.preventDefault();
    if ($("#nw")) { endField(); $("#nw-item").focus(); } else { closePanel(); $("#more").focus(); }
    return;
  }
  if (e.target.closest(".cmds")) {
    const bs = [...document.querySelectorAll(".cmds button")], i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); bs[(i + 1) % bs.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); }
    if (e.key === "ArrowRight" && document.activeElement.id === "nw-item") { e.preventDefault(); field(); }
  }
}

/* Step 1: the branch field, beside New worktree */
let text = "", pick = 0;
function field() {
  if ($("#nw")) { $("#branch").focus(); return; }
  text = ""; pick = 0;
  $("#right").classList.add("busy");
  $("#nw-item").setAttribute("aria-expanded", "true");
  $("#right").insertAdjacentHTML("beforeend", `<div class="nw" id="nw">
    <div class="box" id="box"><span class="ghost" id="ghost" aria-hidden="true"></span><input id="branch" aria-label="Branch for the new worktree" spellcheck="false" autocomplete="off"></div>
    <div class="what" id="what" role="status"></div>
  </div>`);
  const input = $("#branch");
  input.addEventListener("input", () => {
    const pos = input.selectionStart;
    input.value = input.value.replace(/ /g, "-");
    input.setSelectionRange(pos, pos);
    text = input.value; pick = 0; render();
  });
  input.addEventListener("keydown", fieldKeys);
  render();
  input.focus();
}
function endField() {
  $("#nw")?.remove();
  $("#right")?.classList.remove("busy");
  $("#nw-item")?.setAttribute("aria-expanded", "false");
}
function render() {
  const list = candidates(text), c = list[pick] ?? "";
  $("#ghost").innerHTML = !c ? ""
    : c.startsWith(text) ? `<span class="typed">${esc(text)}</span><span class="rest">${esc(c.slice(text.length))}  ⇥</span>`
    : `<span class="typed">${esc(text)}</span><span class="other">${esc(c)}  ⇥</span>`;
  const o = outcome(text), what = $("#what");
  what.className = `what${o?.err ? " err" : ""}`;
  what.innerHTML = !o ? "" : o.err ? o.err : o.text ? `<span class="${o.kind === "new" ? "new" : ""}">${o.text}</span>` : "";
  $("#box").classList.toggle("invalid", Boolean(o?.err));
}
function fieldKeys(e) {
  const list = candidates(text);
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && list.length) {
    e.preventDefault();
    pick = (pick + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length;
    render();
  } else if (e.key === "Tab" && !e.shiftKey && list[pick]) {
    e.preventDefault();
    const input = $("#branch");
    input.value = text = list[pick];
    pick = 0; render();
    input.setSelectionRange(text.length, text.length);
  } else if (e.key === "ArrowLeft" && !text) {
    e.preventDefault(); endField(); $("#nw-item").focus();
  } else if (e.key === "Enter") {
    e.preventDefault();
    const o = outcome(text);
    if (o && !o.err && o.text) create(text, o);
  }
}

/* Step 2: the worktree exists and nothing runs in it. The panel closes so the new row
   is seen arriving; focus moves to it, so Enter or ⋯ opens its launchers as usual.
   A branch already checked out elsewhere creates nothing: its row is the one that flares. */
function create(branch, o) {
  $("#branch").disabled = true;
  $("#what").innerHTML = o.kind === "new" ? `Creating from ${REPO.head}…` : o.kind === "open" ? "" : "Checking out…";
  setTimeout(() => {
    if (o.kind !== "open") REPO.local[branch] = `foom-${branch.split("/").pop()}`;
    if (!worktrees.some(([b]) => b === branch)) worktrees.push([branch, null]);
    closePanel();
    fresh = branch;
    tree();
    $(".trow.wt.fresh").focus({ preventScroll: true });
    $(".trow.wt.fresh").scrollIntoView({ block: "nearest" });
  }, o.kind === "open" ? 0 : 500);
}
/* The tint and edge clear once the user has looked: on hover, or when focus leaves the row. */
function settle(e) {
  setTimeout(() => { fresh = ""; $(".trow.wt.fresh")?.classList.remove("fresh"); }, e.type === "blur" ? 0 : 600);
}

document.addEventListener("pointerdown", (e) => { if (panelOpen() && !e.target.closest(".panel, #more")) closePanel(); });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || (e.ctrlKey && e.shiftKey)) && e.code === "KeyT") { e.preventDefault(); openPanel(true); }
});
$("#m-reset").addEventListener("click", () => location.reload());
$("#m-theme").addEventListener("change", (e) => { if (e.target.value) document.documentElement.dataset.theme = e.target.value; else delete document.documentElement.dataset.theme; });
tree();
openPanel(true);
</script>
</body>
</html>
