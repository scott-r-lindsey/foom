<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foom Tile Panels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Tiles, tidied: terminals carry two buttons and a panel; empty space is space, not a tile.
   Colors are the brand tokens from src/renderer/styles/tokens.css; panel styling follows
   sidebar-panels.html. */
:root {
  --bg: #f3f0fa; --surface: #e9e4f5; --line: #ddd6ee; --ink: #14101f; --muted: #625a7a;
  --accent: #5b2bd9; --accent-deep: #3b1a99; --attention: #d98200; --attention-ink: #8c5000;
  --done: #13804a; --done-ink: #0e6b3c; --failed: #d6166e; --failed-ink: #b0105a;
  --idle: #b9b0d3; --badge: #4a4263; --badge-ink: #f4efff; --lift: #ffffff;
  --shadow: rgba(40, 20, 90, .28);
  --term-bg: #05040a; --term-line: #251d3f; --term-ink: #f4efff; --term-dim: #6a6188; --term-acc: #c08bff;
  --display: "Archivo Black", sans-serif;
  --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05040a; --surface: #0d0a17; --line: #251d3f; --ink: #f4efff; --muted: #9d93bd;
    --accent: #9b6bff; --accent-deep: #7a3cff; --attention: #ffb23e; --attention-ink: #ffb23e;
    --done: #6fe0a3; --done-ink: #6fe0a3; --failed: #ff2e88; --failed-ink: #ff2e88;
    --idle: #4a4263; --badge: #3a3060; --badge-ink: #f4efff; --lift: #f4efff;
    --shadow: rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05040a; --surface: #0d0a17; --line: #251d3f; --ink: #f4efff; --muted: #9d93bd;
  --accent: #9b6bff; --accent-deep: #7a3cff; --attention: #ffb23e; --attention-ink: #ffb23e;
  --done: #6fe0a3; --done-ink: #6fe0a3; --failed: #ff2e88; --failed-ink: #ff2e88;
  --idle: #4a4263; --badge: #3a3060; --badge-ink: #f4efff; --lift: #f4efff;
  --shadow: rgba(0, 0, 0, .85);
  color-scheme: dark;
}
:root {
  --highlight: var(--accent);
  --highlight-deep: var(--accent-deep);
  --select: color-mix(in srgb, var(--highlight) 18%, var(--surface));
  --halo: color-mix(in srgb, var(--attention) 25%, transparent);
  --raised-top: color-mix(in srgb, var(--surface) 92%, var(--lift));
  --raised-bottom: var(--surface);
  --raised-line: color-mix(in srgb, var(--highlight) 25%, var(--line));
  --raised-hover: color-mix(in srgb, var(--highlight) 12%, var(--raised-top));
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--highlight); outline-offset: 1px; }
.frame { height: 100%; overflow-x: auto; }
.app { display: flex; height: 100%; min-width: 1100px; overflow: hidden; }

/* Sidebar slice: sessions only. */
.side { width: 270px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--line); }
.head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 14px 12px; }
.head b { font: 22px var(--display); font-weight: 400; color: var(--accent); }
.head span { font: 11px var(--mono); color: var(--muted); }
.list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
.group { padding: 10px 8px 4px; font: 600 12px var(--sans); color: var(--muted); }
.srow { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 6px 8px; background: transparent; border: 0; border-radius: 6px; text-align: left; }
.srow:hover { background: color-mix(in srgb, var(--select) 55%, transparent); }
.srow.sel { background: var(--select); }
.srow.hidden-session { opacity: .7; }
.srow .light { margin-top: 4px; }
.srow .lines { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.srow .top { display: flex; align-items: center; gap: 6px; font: 12px var(--mono); }
.srow .top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .reason { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.srow .reason.needs { color: var(--attention-ink); }
.tile-no { margin-left: auto; flex-shrink: 0; min-width: 16px; height: 16px; padding: 0 4px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; font: 10px var(--mono); color: var(--muted); }
.srow.buzz { animation: buzz 260ms ease; }
@keyframes buzz { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.light { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.light.needs { background: var(--attention); box-shadow: 0 0 0 4px var(--halo); }
.light.working { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.light.done { background: var(--done); }
.light.failed { background: var(--failed); border-radius: 2px; }
.badge { flex-shrink: 0; min-width: 24px; height: 20px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--badge); color: var(--badge-ink); font: 600 11px var(--mono); }

/* Tile area */
.area { position: relative; flex: 1; min-width: 0; background: var(--bg); }
.tile { position: absolute; display: flex; flex-direction: column; overflow: hidden; background: var(--term-bg); border: 1px solid var(--term-line); border-radius: 6px; transition: left 180ms ease, top 180ms ease, width 180ms ease, height 180ms ease, opacity 160ms ease; }
.area.dragging .tile, .area.dragging .space { transition: none; }
.tile.focus { border-color: var(--term-acc); }
.tile.needs { border-color: var(--attention); }
.tile.behind { opacity: 0; pointer-events: none; }
.tile.front { z-index: 3; }
/* Title bar: light, badge, location, name, then number (opens the panel), maximize, close. */
.tb { display: flex; align-items: center; gap: 8px; height: 30px; flex-shrink: 0; padding: 0 4px 0 10px; background: #0d0a17; border-bottom: 1px solid var(--term-line); color: #9d93bd; font: 12px var(--mono); user-select: none; }
.tile.focus .tb { background: #15111f; color: var(--term-ink); }
.tb .badge { background: #3a3060; color: #f4efff; height: 18px; }
.tb .loc { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6a6188; }
.tb .name { flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9c0e6; }
.tile.focus .tb .name { color: var(--term-ink); }
.tb .grow { flex: 1; }
.tb button { flex-shrink: 0; height: 22px; padding: 0; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 5px; color: #9d93bd; }
.tb button:hover { background: #1c1632; color: #f4efff; }
.tb .no { min-width: 22px; padding: 0 5px; border-color: #251d3f; font: 11px var(--mono); }
.tile.focus .tb .no { border-color: var(--term-acc); color: #f4efff; }
.tb .no[aria-expanded="true"] { background: #2a2147; border-color: var(--term-acc); color: #f4efff; }
.tb .ctl { width: 24px; opacity: 0; transition: opacity 120ms ease; }
.tile:hover .ctl, .tile.focus .ctl, .tile:focus-within .ctl { opacity: 1; }
.tb svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.out { flex: 1; margin: 0; padding: 10px 14px; overflow: hidden; color: var(--term-ink); font: 13px/1.5 "Hack Nerd Font Mono", "Geist Mono", monospace; white-space: pre; }
.tile:not(.focus) .out { opacity: .78; }
.cursor { display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: var(--term-ink); }
.tile:not(.focus) .cursor { background: transparent; outline: 1px solid var(--term-dim); }
.t-dim { color: var(--term-dim); } .t-acc { color: var(--term-acc); } .t-att { color: #ffb23e; }

/* Empty space: no title bar, no number, never focused. The newest space is where the next
   session lands, so it carries a faint highlight. */
.space { position: absolute; border: 1px dashed color-mix(in srgb, var(--muted) 35%, transparent); border-radius: 6px; transition: left 180ms ease, top 180ms ease, width 180ms ease, height 180ms ease, opacity 160ms ease, border-color 160ms ease, background-color 160ms ease; }
.space.landing { border-color: color-mix(in srgb, var(--highlight) 60%, transparent); background: color-mix(in srgb, var(--highlight) 5%, transparent); }
.space.drop { border-style: solid; border-color: var(--highlight); background: color-mix(in srgb, var(--highlight) 12%, transparent); }
.space.collapsing { opacity: .25; }
.space.behind { opacity: 0; }

.gutter { position: absolute; z-index: 2; }
.gutter.col { cursor: col-resize; }
.gutter.row { cursor: row-resize; }
.gutter::after { content: ""; position: absolute; border-radius: 2px; transition: background-color 120ms ease; }
.gutter.col::after { left: 50%; top: 20%; bottom: 20%; width: 2px; margin-left: -1px; }
.gutter.row::after { top: 50%; left: 20%; right: 20%; height: 2px; margin-top: -1px; }
.gutter:hover::after, .gutter.active::after { background: var(--highlight); }

/* The tile panel: same family as the sidebar panels. Commands left, facts right. */
.panel { position: absolute; z-index: 30; width: 600px; padding: 4px; background: linear-gradient(180deg, var(--raised-top), var(--raised-bottom)); border: 1px solid var(--raised-line); border-radius: 10px; box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 22px 48px -12px var(--shadow), 0 8px 16px -8px var(--shadow), 0 0 28px -8px color-mix(in srgb, var(--highlight) 40%, transparent); transform-origin: var(--ox) 0; animation: panel-in 160ms cubic-bezier(.2, .8, .2, 1) both; }
.panel::before { content: ""; position: absolute; top: -6px; left: calc(var(--ox) - 5px); width: 10px; height: 10px; background: var(--raised-top); border-left: 1px solid var(--raised-line); border-top: 1px solid var(--raised-line); transform: rotate(45deg); }
.panel.at-pointer::before { display: none; }
.p-head { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); border-radius: 7px 7px 0 0; background: linear-gradient(100deg, color-mix(in srgb, var(--highlight) 20%, transparent), color-mix(in srgb, var(--highlight) 6%, transparent) 55%, transparent); }
.p-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; border-radius: 7px 7px 0 0; background: linear-gradient(90deg, var(--highlight), var(--highlight-deep) 45%, transparent); }
.p-mark { flex-shrink: 0; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: color-mix(in srgb, var(--highlight) 16%, var(--raised-top)); border: 1px solid color-mix(in srgb, var(--highlight) 35%, var(--line)); font: 600 13px var(--mono); color: var(--highlight); }
.p-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 13px var(--mono); }
.p-kind { flex-shrink: 0; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--highlight) 12%, transparent); color: var(--highlight); font: 11px var(--mono); }
.p-body { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.p-actions { display: flex; flex-direction: column; gap: 1px; padding: 8px 8px 8px 4px; border-right: 1px solid var(--line); border-radius: 0 0 0 7px; background: linear-gradient(180deg, color-mix(in srgb, var(--highlight) 7%, transparent), color-mix(in srgb, var(--highlight) 3%, transparent)); }
.panel hr { height: 1px; width: calc(100% - 12px); margin: 4px 6px; border: 0; background: var(--line); }
.item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 6px 12px; background: transparent; border: 0; border-radius: 6px; text-align: left; transition: background-color 120ms ease; animation: item-in 200ms cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d) * 22ms + 50ms); }
.item::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--highlight); transform: scaleY(0); transition: transform 160ms cubic-bezier(.2, .8, .2, 1); }
.item:hover:not(:disabled), .item:focus-visible { background: var(--raised-hover); outline: none; }
.item:hover:not(:disabled)::before, .item:focus-visible::before { transform: scaleY(1); }
.item:disabled { cursor: default; color: var(--muted); }
.item:disabled .glyph { opacity: .5; }
.item .label { flex: 1; min-width: 0; }
.item .label small { display: block; font: 11px var(--mono); color: var(--muted); }
.item .hint { flex-shrink: 0; font: 11px var(--mono); color: var(--muted); }
/* Direction diagrams: the tile as a box, what the command does drawn inside it. */
.glyph { flex-shrink: 0; width: 24px; display: grid; place-items: center; color: var(--muted); }
.glyph svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.glyph svg .new { stroke: var(--highlight); stroke-dasharray: 1.6 1.6; }
.glyph svg .fill { fill: color-mix(in srgb, var(--highlight) 30%, transparent); stroke: none; }
.item:hover:not(:disabled) .glyph, .item:focus-visible .glyph { color: var(--ink); }
.facts { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-content: start; gap: 9px 16px; margin: 0; padding: 14px 18px 16px 20px; }
.facts dt { padding-top: 2px; font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; min-width: 0; font: 12.5px/1.5 var(--mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.facts dd .sub { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; height: 19px; border-radius: 999px; font: 11.5px var(--mono); white-space: nowrap; background: color-mix(in srgb, var(--tone) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tone) 32%, transparent); color: var(--tone-ink); }
.chip .light { width: 7px; height: 7px; box-shadow: none; }
.chip.working { --tone: var(--accent); --tone-ink: var(--accent); }
.chip.needs { --tone: var(--attention); --tone-ink: var(--attention-ink); }
.chip.done { --tone: var(--done); --tone-ink: var(--done-ink); }
.chip.neutral { --tone: var(--muted); --tone-ink: var(--ink); }
@keyframes panel-in { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
@keyframes item-in { from { opacity: 0; transform: translateX(-6px); } }

/* Mockup controls, not part of the design. */
.mock { position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100vw - 24px); }
.mock button, .mock select { height: 30px; padding: 0 10px; background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; }
.mock span { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .tile, .space, .panel, .item, .item::before, .srow.buzz { transition: none; animation: none; }
}
</style>
</head>
<body>
<div class="frame">
<div class="app">
  <nav class="side" aria-label="Sessions">
    <div class="head"><b>foom</b><span id="status" role="status"></span></div>
    <div class="list" id="list"></div>
  </nav>
  <main class="area" id="area" aria-label="Terminal tiles"></main>
</div>
</div>
<div class="mock">
  <span id="note">Click a tile number for its panel, or right-click a title bar.</span>
  <select id="scene" aria-label="Mockup: layout">
    <option value="space">Layout: two terminals and a space</option>
    <option value="one">Layout: one terminal</option>
    <option value="four">Layout: four terminals</option>
    <option value="spaces">Layout: three terminals, two spaces</option>
  </select>
  <select id="theme" aria-label="Mockup: color mode">
    <option value="">System</option><option value="light">Light</option><option value="dark">Dark</option>
  </select>
</div>
<script>
const AGENT = { claude: "CC", codex: "CX", agy: "AG", shell: ">_" };
const STATE = { needs: "Needs you", working: "Working", done: "Done", quiet: "Quiet" };
const sessions = [
  { id: "a", agent: "claude", name: "Fix tile focus", repo: "foom", branch: "issue-219", light: "needs", reason: "Apply this edit?",
    out: `<span class="t-acc">●</span> Split now keeps focus on the terminal you were in.\n\n  Edit src/renderer/board/tiles.ts\n  <span class="t-dim">│</span>  51 -    focused: next.id,\n  <span class="t-dim">│</span>  51 +    focused: layout.focused,\n\n  <span class="t-att">Apply this edit?</span>\n  <span class="t-acc">❯ 1. Yes</span>\n    2. No, explain what to change\n` },
  { id: "b", agent: "codex", name: "Environment variables", repo: "foom", branch: "issue-215", light: "working", reason: "Running npm run check",
    out: `<span class="t-dim">•</span> Running npm run check\n\n  <span class="t-dim">✓ environment layers global, then per-agent</span>\n  <span class="t-dim">✓ reserved names are refused in main</span>\n  <span class="t-dim">✓ NO_PROXY keeps loopback entries</span>\n  <span class="t-acc">⠙</span> secrets never reach the renderer\n` },
  { id: "c", agent: "shell", name: "npm start", repo: "foom", branch: "main", light: "working", reason: "Foom Dev",
    out: `<span class="t-dim">$</span> npm start\n\n> foom@0.1.0 start\n> npm run build && electron . --user-data-dir=…/Foom Dev\n\n<span class="t-dim">built main, preload, renderer in 1.8s</span>\n` },
  { id: "d", agent: "claude", name: "Trusted dialog scrim", repo: "foom", branch: "issue-213", light: "done", reason: "Turn ended",
    out: `<span class="t-acc">●</span> The board now dims itself; the trusted window is only the card.\n\n  PR #221 is open as a draft.\n\n<span class="t-dim">✳ Done</span>\n` },
  { id: "e", agent: "codex", name: "Nightly notes", repo: "foom", branch: "issue-207", light: "quiet", reason: "Quiet",
    out: `<span class="t-dim">•</span> Waiting for your next message.\n` },
  { id: "f", agent: "agy", name: "Theme files", repo: "foom", branch: "issue-205", light: "done", reason: "Exited 0",
    out: `<span class="t-dim">Session ended.</span>\n` },
];
const byId = (id) => sessions.find((s) => s.id === id);

let uid = 0;
const leaf = (session = null) => ({ leaf: true, id: "t" + uid++, session, born: uid });
const split = (dir, a, b, ratio = 0.5) => ({ leaf: false, id: "n" + uid++, dir, ratio, a, b });
const SCENES = {
  space: () => split("row", leaf("a"), split("col", leaf("b"), leaf()), 0.55),
  one: () => leaf("a"),
  four: () => split("row", split("col", leaf("a"), leaf("b")), split("col", leaf("c"), leaf("d"))),
  spaces: () => split("row", split("col", leaf("a"), leaf()), split("col", leaf("b"), split("row", leaf("c"), leaf()), 0.6)),
};
let tree, focused, maximized = null, panel = null;

const leaves = (n) => (n.leaf ? [n] : [...leaves(n.a), ...leaves(n.b)]);
const terminals = () => leaves(tree).filter((l) => l.session);
const isSpace = (n) => leaves(n).every((l) => !l.session);
const numberOf = (l) => terminals().indexOf(l) + 1;
const tileOf = (sid) => leaves(tree).find((l) => l.session === sid);
const landing = () => leaves(tree).filter((l) => !l.session).sort((x, y) => y.born - x.born)[0];
function parentOf(target, n = tree, p = null) {
  if (n === target) return p;
  if (n.leaf) return undefined;
  return parentOf(target, n.a, n) ?? parentOf(target, n.b, n);
}
function replace(target, next) {
  const p = parentOf(target);
  if (!p) tree = next; else if (p.a === target) p.a = next; else p.b = next;
}
function load(scene) {
  tree = SCENES[scene]();
  focused = terminals()[0]?.id ?? null;
  maximized = null;
  closePanel();
  render();
}

/* Commands */
function doSplit(l, dir) {
  const space = leaf();
  replace(l, split(dir, l, space));
  focused = l.id; // focus stays in the terminal; the new space becomes the landing spot
}
/* Grow absorbs empty space along one axis: the nearest split in that direction whose other
   side holds no terminal. A terminal neighbour keeps its space; the gutter shares it. */
function growTarget(l, dir) {
  let child = l, p = parentOf(l);
  while (p) {
    if (p.dir === dir) {
      const other = p.a === child ? p.b : p.a;
      return isSpace(other) ? { split: p, keep: child } : { blocked: "Next to a terminal" };
    }
    child = p; p = parentOf(p);
  }
  return { blocked: dir === "row" ? "Already full width" : "Already full height" };
}
function grow(l, dir) {
  const t = growTarget(l, dir);
  if (t.split) replace(t.split, t.keep);
}
function close(l) {
  const p = parentOf(l);
  if (!p) { tree = leaf(); focused = null; }
  else {
    const sibling = p.a === l ? p.b : p.a;
    replace(p, sibling);
    if (focused === l.id) focused = leaves(sibling).find((x) => x.session)?.id ?? terminals()[0]?.id ?? null;
  }
  if (maximized === l.id) maximized = null;
}
function place(sid) {
  const shown = tileOf(sid);
  if (shown) { focused = shown.id; render(); return; }
  const spot = landing();
  if (!spot) {
    const row = document.querySelector(`[data-session="${sid}"]`);
    row.classList.remove("buzz"); void row.offsetWidth; row.classList.add("buzz");
    return;
  }
  spot.session = sid;
  focused = spot.id; // you chose this session, so focus follows it
  render();
}

/* Layout geometry */
const GAP = 6, PAD = 6;
function layout(n, x, y, w, h, out) {
  if (n.leaf) { out.cells.push({ n, x, y, w, h }); return out; }
  if (n.dir === "row") {
    const aw = Math.round((w - GAP) * n.ratio);
    layout(n.a, x, y, aw, h, out);
    out.gutters.push({ n, x: x + aw, y, w: GAP, h, origin: x, span: w });
    layout(n.b, x + aw + GAP, y, w - aw - GAP, h, out);
  } else {
    const ah = Math.round((h - GAP) * n.ratio);
    layout(n.a, x, y, w, ah, out);
    out.gutters.push({ n, x, y: y + ah, w, h: GAP, origin: y, span: h });
    layout(n.b, x, y + ah + GAP, w, h - ah - GAP, out);
  }
  return out;
}
const size = (c) => ({ cols: Math.max(0, Math.floor((c.w - 30) / 7.8)), rows: Math.max(0, Math.floor((c.h - 52) / 19.5)) });

const area = document.getElementById("area");
const ICON = {
  max: `<svg viewBox="0 0 14 14"><path d="M8.5 2.5h3v3M5.5 11.5h-3v-3M11.5 2.5L8 6M2.5 11.5L6 8"/></svg>`,
  restore: `<svg viewBox="0 0 14 14"><path d="M4 7h3v3M10 7H7V4M7 7L2.5 11.5M7 7l4.5-4.5"/></svg>`,
  close: `<svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg>`,
};
let geometry = [];

function render() {
  const r = area.getBoundingClientRect();
  const geo = layout(tree, PAD, PAD, r.width - PAD * 2, r.height - PAD * 2, { cells: [], gutters: [] });
  geometry = geo.cells;
  const land = landing();
  const keep = new Set();
  for (const c of geo.cells) {
    const l = c.n;
    keep.add(l.id);
    let el = area.querySelector(`[data-id="${l.id}"]`);
    const kind = l.session ? "tile" : "space";
    if (el && !el.classList.contains(kind)) { el.remove(); el = null; }
    if (!el) {
      el = document.createElement(l.session ? "section" : "div");
      el.dataset.id = l.id;
      area.append(el);
    }
    const full = maximized === l.id;
    const box = full ? { x: PAD, y: PAD, w: r.width - PAD * 2, h: r.height - PAD * 2 } : c;
    Object.assign(el.style, { left: box.x + "px", top: box.y + "px", width: box.w + "px", height: box.h + "px" });
    if (l.session) renderTile(el, l, maximized && !full, full);
    else {
      el.className = "space" + (l === land ? " landing" : "") + (maximized ? " behind" : "");
      el.removeAttribute("tabindex");
      el.setAttribute("aria-hidden", "true");
      el.innerHTML = "";
    }
  }
  for (const el of area.querySelectorAll("[data-id]")) if (!keep.has(el.dataset.id)) el.remove();
  area.querySelectorAll(".gutter").forEach((g) => g.remove());
  if (!maximized) for (const g of geo.gutters) {
    const el = document.createElement("div");
    el.className = "gutter " + (g.n.dir === "row" ? "col" : "row");
    Object.assign(el.style, { left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px" });
    el.setAttribute("role", "separator");
    el.setAttribute("aria-orientation", g.n.dir === "row" ? "vertical" : "horizontal");
    el.setAttribute("aria-label", "Resize tiles");
    el.dataset.node = g.n.id;
    el.addEventListener("pointerdown", (e) => dragGutter(e, g));
    area.append(el);
  }
  renderList();
  if (panel) renderPanel();
}

function renderTile(el, l, behind, full) {
  const s = byId(l.session);
  el.className = "tile" + (l.id === focused ? " focus" : "") + (s.light === "needs" ? " needs" : "") + (behind ? " behind" : "") + (full ? " front" : "");
  el.tabIndex = 0;
  el.setAttribute("aria-label", `Tile ${numberOf(l)}: ${s.name}`);
  el.removeAttribute("aria-hidden");
  const open = panel?.id === l.id;
  el.innerHTML = `<header class="tb">
      <span class="light ${s.light}" role="img" aria-label="${STATE[s.light]}"></span>
      <span class="badge">${AGENT[s.agent]}</span>
      <span class="loc">${s.repo} › ${s.branch}</span>
      <span class="name">${s.name}</span>
      <span class="grow"></span>
      <button type="button" class="no" data-act="panel" aria-haspopup="dialog" aria-expanded="${open}" title="Tile ${numberOf(l)}">${numberOf(l)}</button>
      <button type="button" class="ctl" data-act="max" aria-label="${full ? "Restore tile" : "Maximize tile"}" title="${full ? "Restore tile" : "Maximize tile"}">${full ? ICON.restore : ICON.max}</button>
      <button type="button" class="ctl" data-act="close" aria-label="Close tile" title="Close tile">${ICON.close}</button>
    </header><div class="out">${s.out}<span class="cursor"></span></div>`;
}

function renderList() {
  const list = document.getElementById("list");
  const needs = sessions.filter((s) => s.light === "needs").length;
  const working = sessions.filter((s) => s.light === "working").length;
  document.getElementById("status").textContent = `${needs} needs you · ${working} working`;
  const focusSession = leaves(tree).find((l) => l.id === focused)?.session;
  list.innerHTML = `<div class="group">foom</div>` + sessions.map((s) => {
    const t = tileOf(s.id);
    return `<button type="button" class="srow${s.id === focusSession ? " sel" : ""}${t ? "" : " hidden-session"}" data-session="${s.id}" draggable="true">
      <span class="light ${s.light}" role="img" aria-label="${STATE[s.light]}"></span>
      <span class="lines"><span class="top"><span class="badge">${AGENT[s.agent]}</span><span>${s.name}</span>${t ? `<span class="tile-no">${numberOf(t)}</span>` : ""}</span>
      <span class="reason${s.light === "needs" ? " needs" : ""}">${s.reason}</span></span></button>`;
  }).join("");
}

/* Panel */
const DIAGRAM = {
  right: `<svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1.5"/><rect class="new" x="9.5" y="4.5" width="5" height="9" rx=".8"/></svg>`,
  down: `<svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1.5"/><rect class="new" x="3.5" y="9.5" width="11" height="4" rx=".8"/></svg>`,
  growx: `<svg viewBox="0 0 18 18"><rect class="fill" x="6" y="5" width="6" height="8"/><rect x="2" y="3" width="14" height="12" rx="1.5"/><path d="M5.5 9H2.8M12.5 9h2.7M4 7.5L2.6 9 4 10.5M14 7.5l1.4 1.5-1.4 1.5"/></svg>`,
  growy: `<svg viewBox="0 0 18 18"><rect class="fill" x="5" y="6" width="8" height="6"/><rect x="2" y="2" width="14" height="14" rx="1.5"/><path d="M9 5.5V2.8M9 12.5v2.7M7.5 4L9 2.6 10.5 4M7.5 14L9 15.4 10.5 14"/></svg>`,
  max: `<svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1.5"/><path d="M10.5 5.5h3v3M7.5 12.5h-3v-3M13.5 5.5L10 9M4.5 12.5L8 9"/></svg>`,
  restore: `<svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1.5"/><path d="M6 9h3v3M12 9H9V6"/></svg>`,
  popout: `<svg viewBox="0 0 18 18"><path d="M8 4H3.5A1.5 1.5 0 0 0 2 5.5v8A1.5 1.5 0 0 0 3.5 15h8a1.5 1.5 0 0 0 1.5-1.5V10M10 2.5h5.5V8M15.5 2.5L8.5 9.5"/></svg>`,
  close: `<svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1.5"/><path d="M6.5 6.5l5 5M11.5 6.5l-5 5"/></svg>`,
};
function openPanel(l, at) {
  panel = { id: l.id, at };
  render();
  panelEl()?.querySelector(".item:not(:disabled)")?.focus({ preventScroll: true });
}
function closePanel() {
  panel = null;
  document.querySelector(".panel")?.remove();
  area.querySelectorAll('.no[aria-expanded="true"]').forEach((b) => b.setAttribute("aria-expanded", "false"));
}
const panelEl = () => document.querySelector(".panel");
function renderPanel() {
  const l = leaves(tree).find((x) => x.id === panel.id);
  if (!l || !l.session) { closePanel(); return; }
  const s = byId(l.session);
  const cell = geometry.find((c) => c.n === l);
  const full = maximized === l.id;
  const sz = size(full ? { w: area.clientWidth - PAD * 2, h: area.clientHeight - PAD * 2 } : cell);
  const gx = growTarget(l, "row"), gy = growTarget(l, "col");
  const items = [
    ["right", "Split right", DIAGRAM.right, null],
    ["down", "Split down", DIAGRAM.down, null],
    ["growx", "Grow sideways", DIAGRAM.growx, gx.blocked],
    ["growy", "Grow vertically", DIAGRAM.growy, gy.blocked],
    "hr",
    ["max", full ? "Restore" : "Maximize", full ? DIAGRAM.restore : DIAGRAM.max, null, "⇧⌘↵"],
    ["popout", "Move to new window", DIAGRAM.popout, null],
    "hr",
    ["close", "Close tile", DIAGRAM.close, null, "⌥⇧⌘W"],
  ];
  let d = 0;
  const html = `<div class="panel${panel.at ? " at-pointer" : ""}" role="dialog" aria-label="Tile ${numberOf(l)}">
    <div class="p-head"><span class="p-mark">${numberOf(l)}</span><span class="p-title">${s.name}</span><span class="p-kind">Tile ${numberOf(l)} of ${terminals().length}</span></div>
    <div class="p-body"><div class="p-actions" role="menu">${items.map((it) => it === "hr" ? "<hr>" :
      `<button type="button" class="item" role="menuitem" data-cmd="${it[0]}" style="--d:${d++}"${it[3] ? " disabled" : ""}>
        <span class="glyph">${it[2]}</span><span class="label">${it[1]}${it[3] ? `<small>${it[3]}</small>` : ""}</span>${it[4] ? `<span class="hint">${it[4]}</span>` : ""}</button>`).join("")}</div>
    <dl class="facts">
      <dt>Session</dt><dd><span class="chip ${s.light === "quiet" ? "neutral" : s.light}"><span class="light ${s.light}"></span>${STATE[s.light]}</span> <span class="sub">${s.reason}</span></dd>
      <dt>Size</dt><dd>${sz.cols} × ${sz.rows} <span class="sub">columns × rows</span></dd>
      <dt>Location</dt><dd>${s.repo} › ${s.branch}</dd>
      <dt>Agent</dt><dd><span class="badge">${AGENT[s.agent]}</span></dd>
    </dl></div></div>`;
  panelEl()?.remove();
  area.insertAdjacentHTML("beforeend", html);
  const p = panelEl();
  const ar = area.getBoundingClientRect();
  let x, y, ox;
  if (panel.at) { x = panel.at.x - ar.left; y = panel.at.y - ar.top + 4; ox = 20; }
  else {
    const b = area.querySelector(`[data-id="${l.id}"] .no`).getBoundingClientRect();
    const cx = b.left + b.width / 2 - ar.left;
    x = cx - p.offsetWidth + 40; y = b.bottom - ar.top + 8; ox = cx;
  }
  x = Math.max(8, Math.min(x, ar.width - p.offsetWidth - 8));
  y = Math.min(y, ar.height - p.offsetHeight - 8);
  p.style.left = x + "px"; p.style.top = y + "px";
  p.style.setProperty("--ox", Math.max(16, Math.min(ox - x, p.offsetWidth - 16)) + "px");
  area.querySelector(`[data-id="${l.id}"] .no`)?.setAttribute("aria-expanded", "true");
}

function run(cmd, l) {
  if (cmd === "right") doSplit(l, "row");
  if (cmd === "down") doSplit(l, "col");
  if (cmd === "growx") grow(l, "row");
  if (cmd === "growy") grow(l, "col");
  if (cmd === "max") maximized = maximized === l.id ? null : l.id;
  if (cmd === "close" || cmd === "popout") close(l);
  if (cmd === "popout") note(`Mockup: ${byId(l.session).name} would open in a new window.`);
  closePanel();
  render();
  area.querySelector(`[data-id="${focused}"]`)?.focus({ preventScroll: true });
}
function note(text) { document.getElementById("note").textContent = text; }

/* Gutters: terminals keep 15–85%. Empty space can be squeezed to nothing; past 92% it closes
   and the neighbour takes the room. */
function dragGutter(e, g) {
  e.preventDefault();
  closePanel();
  const n = g.n, horizontal = n.dir === "row";
  const aSpace = isSpace(n.a), bSpace = isSpace(n.b);
  const lo = aSpace ? 0 : 0.15, hi = bSpace ? 1 : 0.85;
  e.currentTarget.classList.add("active");
  area.classList.add("dragging");
  let collapse = null;
  const move = (ev) => {
    const ar = area.getBoundingClientRect();
    const pos = (horizontal ? ev.clientX - ar.left : ev.clientY - ar.top) - g.origin;
    let ratio = Math.min(hi, Math.max(lo, pos / g.span));
    collapse = aSpace && ratio < 0.08 ? n.a : bSpace && ratio > 0.92 ? n.b : null;
    n.ratio = collapse ? (collapse === n.a ? 0.04 : 0.96) : Math.min(Math.max(ratio, aSpace ? 0.08 : 0.15), bSpace ? 0.92 : 0.85);
    render();
    for (const l of leaves(n.a).concat(leaves(n.b)))
      area.querySelector(`[data-id="${l.id}"]`)?.classList.toggle("collapsing", Boolean(collapse) && leaves(collapse).includes(l));
    area.querySelector(`.gutter[data-node="${n.id}"]`)?.classList.add("active");
  };
  const up = () => {
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
    area.classList.remove("dragging");
    if (collapse) replace(n, collapse === n.a ? n.b : n.a);
    render();
  };
  addEventListener("pointermove", move);
  addEventListener("pointerup", up);
}

/* Events */
area.addEventListener("click", (e) => {
  if (e.target.closest(".panel")) {
    const item = e.target.closest(".item");
    if (item && !item.disabled) run(item.dataset.cmd, leaves(tree).find((x) => x.id === panel.id));
    return;
  }
  const tile = e.target.closest(".tile");
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!tile) { closePanel(); return; }
  const l = leaves(tree).find((x) => x.id === tile.dataset.id);
  if (act === "panel") { if (panel?.id === l.id) closePanel(); else { focused = l.id; openPanel(l); } return; }
  if (act === "max") { run("max", l); return; }
  if (act === "close") { run("close", l); return; }
  if (panel) closePanel();
  if (focused !== l.id) { focused = l.id; render(); }
});
area.addEventListener("dblclick", (e) => {
  const tile = e.target.closest(".tile");
  if (tile && e.target.closest(".tb") && !e.target.closest("button")) run("max", leaves(tree).find((x) => x.id === tile.dataset.id));
});
area.addEventListener("contextmenu", (e) => {
  const tile = e.target.closest(".tile");
  if (!tile || !e.target.closest(".tb")) return;
  e.preventDefault();
  const l = leaves(tree).find((x) => x.id === tile.dataset.id);
  focused = l.id;
  openPanel(l, { x: e.clientX, y: e.clientY });
});
document.addEventListener("keydown", (e) => {
  if (!panel) return;
  if (e.key === "Escape") {
    const id = panel.id;
    closePanel();
    area.querySelector(`[data-id="${id}"] .no`)?.focus();
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const items = [...document.querySelectorAll(".panel .item:not(:disabled)")];
    const i = items.indexOf(document.activeElement);
    items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus();
  }
});
document.addEventListener("pointerdown", (e) => {
  if (panel && !e.target.closest(".panel") && !e.target.closest(".no")) closePanel();
});
document.getElementById("list").addEventListener("click", (e) => {
  const row = e.target.closest("[data-session]");
  if (row) place(row.dataset.session);
});
/* Drag a session onto empty space to fill it. Dropping on terminals behaves as today (#133). */
document.getElementById("list").addEventListener("dragstart", (e) => {
  const row = e.target.closest("[data-session]");
  if (row) e.dataTransfer.setData("text/plain", row.dataset.session);
});
area.addEventListener("dragover", (e) => {
  const sp = e.target.closest(".space");
  area.querySelectorAll(".space.drop").forEach((x) => x !== sp && x.classList.remove("drop"));
  if (sp) { e.preventDefault(); sp.classList.add("drop"); }
});
area.addEventListener("dragleave", (e) => e.target.closest(".space")?.classList.remove("drop"));
area.addEventListener("drop", (e) => {
  const sp = e.target.closest(".space");
  if (!sp) return;
  e.preventDefault();
  const sid = e.dataTransfer.getData("text/plain");
  const target = leaves(tree).find((x) => x.id === sp.dataset.id);
  const old = tileOf(sid);
  if (old) old.session = null;
  target.session = sid;
  focused = target.id;
  render();
});
document.getElementById("scene").addEventListener("change", (e) => load(e.target.value));
document.getElementById("theme").addEventListener("change", (e) => {
  if (e.target.value) document.documentElement.dataset.theme = e.target.value;
  else delete document.documentElement.dataset.theme;
});
addEventListener("resize", () => render());
load("space");
</script>
</body>
</html>
