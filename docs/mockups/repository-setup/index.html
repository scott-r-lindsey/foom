<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repository setup — Foom #1080 proposal</title>
<style>
@font-face{font-family:Geist;src:url('../../../src/renderer/fonts/geist.ttf');font-weight:100 900}
@font-face{font-family:Archivo;src:url('../../../src/renderer/fonts/archivo-black.ttf')}
@font-face{font-family:Mono;src:url('../../../src/renderer/fonts/geist-mono.ttf');font-weight:100 900}
:root{--bg:#f3f0fa;--surface:#e9e4f5;--line:#ddd6ee;--ink:#14101f;--muted:#625a7a;--accent:#5b2bd9;--need:#8c5000;--lamp:#d98200;--done:#0e6b3c;--fail:#b0105a;--badge:#d6cfe9;color-scheme:light}
:root[data-theme=dark]{--bg:#05040a;--surface:#0d0a17;--line:#251d3f;--ink:#f4efff;--muted:#9d93bd;--accent:#9b6bff;--need:#ffb23e;--lamp:#ffb23e;--done:#6fe0a3;--fail:#ff2e88;--badge:#1c1632;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Geist,system-ui,sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:var(--bg);cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}code,pre,.mono{font-family:Mono,monospace}code{font-size:12px}p{margin:7px 0 14px}h1{font-size:25px;line-height:1.2;margin:0}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.toolbar{border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:14px;align-items:center;font-size:12px}.toolbar select{font-size:12px;padding:4px}.toolbar label:last-child{margin-left:auto}.app{display:grid;grid-template-columns:190px 165px minmax(0,1fr);min-height:calc(100vh - 59px)}aside{padding:24px 16px;border-right:1px solid var(--line)}.brand{font-family:Archivo,sans-serif;font-size:25px;font-weight:400;letter-spacing:-1.5px;margin-bottom:32px}.side-label{font:11px Mono;color:var(--muted);margin:23px 0 8px}.side-row{padding:8px 0;font:12px Mono}.side-row small{display:block;padding-left:16px}.settings{padding-top:29px}.settings strong{display:block;margin-bottom:18px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);margin-bottom:4px}.nav.active{background:var(--surface);color:var(--ink)}main{padding:30px 36px;max-width:1180px;width:100%;min-width:0}.head{margin-bottom:24px}.card{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:16px 0;padding:20px}.card>header{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:16px}.badge{background:var(--badge);border-radius:4px;padding:3px 7px;font:11px Mono}.need{color:var(--need)}.done{color:var(--done)}.failed{color:var(--fail)}.status{display:inline-flex;gap:8px;align-items:center;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}.need .dot{background:var(--lamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 22%,transparent)}.failed .dot{border-radius:1px}.section-label{font:11px Mono;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}.fact{display:grid;grid-template-columns:minmax(135px,1fr) minmax(180px,1.8fr) auto;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}.fact:last-child{border:0}.fact p{margin:3px 0;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.notice{border-left:3px solid var(--accent);padding:10px 14px;margin:16px 0;background:var(--bg)}.notice.attention{border-color:var(--lamp)}.footer{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.steps{margin-top:12px;background:var(--bg);padding:14px;border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 Mono}.terminal{background:var(--bg);border:1px solid var(--line);border-radius:6px;margin-top:16px}.terminal header{padding:10px 14px;border-bottom:1px solid var(--line)}.terminal pre{margin:0;padding:16px;white-space:pre-wrap;font:12px/1.8 Mono}.requirement{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:170px 1fr;gap:15px}.requirement small{display:block;margin-top:3px}details{margin-top:12px}summary{cursor:pointer;color:var(--accent)}textarea{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font:12px Mono;margin-top:12px}.back{border:0;padding:0;color:var(--accent);background:transparent;margin-bottom:14px}.narrow{max-width:740px}.big-status{font-size:16px;margin:12px 0}.off{opacity:.65}.chip-list{display:flex;gap:6px;flex-wrap:wrap}.evidence{margin-top:14px;font-size:12px}.annotation{font-size:12px;color:var(--muted);margin:20px 0}.passmark{color:var(--done)}
@media(max-width:1000px){.app{grid-template-columns:150px minmax(0,1fr)}.settings{display:none}main{padding:24px}.fact{grid-template-columns:1fr 1fr}.fact .actions{grid-column:1/-1}}
@media(max-width:620px){.app{display:block}aside{display:none}.toolbar{flex-wrap:wrap;padding:10px 16px}.toolbar label:last-child{margin-left:0}main{padding:20px 16px}.fact,.requirement{grid-template-columns:1fr;gap:6px}.head{gap:12px}.card{padding:15px}}
</style>
</head>
<body>
<div class="toolbar" aria-label="Mockup controls"><strong>Proposal · #1080</strong><label>Scene <select id="scene"><option value="hosts">Host · needs setup</option><option value="empty">Create list</option><option value="review">Review draft</option><option value="stale">Sources changed</option><option value="running">Setup running</option><option value="failed">Failed step + recheck</option><option value="met">Requirements met</option><option value="launch">Launch refused</option><option value="unsupported">Manual setup</option></select></label><span class="muted">Illustrative data. No commands run.</span><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label></div>
<div class="app"><aside><div class="brand">foom</div><button disabled>+ New worktree</button><div class="side-label">REPOSITORIES</div><div class="side-row">▾ foom<small>▾ main</small><small>○ shell</small></div><div class="side-row">▸ atlas</div><div class="side-label">FOOM CONFIG</div><div class="side-row">⚙ Settings</div></aside><aside class="settings"><strong>Settings</strong><button class="nav" disabled>General</button><button class="nav" disabled>Agents</button><button class="nav" disabled>Forges</button><button class="nav" id="repos">Repositories</button><button class="nav active" id="hosts">Hosts</button><button class="nav" disabled>Environment</button><button class="nav" disabled>Appearance</button><button class="nav" disabled>Terminal</button><button class="nav" disabled>Sound</button></aside><main id="main"></main></div>
<script>
const params=new URLSearchParams(location.search);
let scene=params.get('scene')||'hosts';
let theme=params.get('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const main=document.querySelector('#main');
const status=(kind,text)=>`<span class="status ${kind}"><i class="dot" aria-hidden="true"></i>${text}</span>`;
const btn=(text,target,primary=false)=>`<button ${primary?'class="primary"':''} data-go="${target}">${text}</button>`;
const head=(title,sub)=>`<div class="head row spread"><div><h1>${title}</h1><p class="muted">${sub}</p></div></div>`;
const evidence=`<div class="evidence muted">Reviewed sources · <code>package.json</code> · <code>pnpm-lock.yaml</code> · <code>AGENTS.md</code> · <code>.github/workflows/ci.yml</code></div>`;
const commandSets={
 'Debian / Ubuntu':`1  /usr/bin/sudo /usr/bin/apt-get update\n2  /usr/bin/sudo /usr/bin/apt-get install -y build-essential libnss3\n3  Foom toolchain helper · Node 24.x → pinned release\n4  Foom toolchain helper · pnpm 10.34.7 → verified artifact`,
 'RHEL family':`1  /usr/bin/sudo /usr/bin/dnf install -y gcc gcc-c++ make nss\n2  Foom toolchain helper · Node 24.x → pinned release\n3  Foom toolchain helper · pnpm 10.34.7 → verified artifact`,
 'Arch':`1  /usr/bin/sudo /usr/bin/pacman -S --noconfirm base-devel nss\n2  Foom toolchain helper · Node 24.x → pinned release\n3  Foom toolchain helper · pnpm 10.34.7 → verified artifact`,
 'macOS':`1  brew install pkg-config\n2  Foom toolchain helper · Node 24.x → pinned release\n3  Foom toolchain helper · pnpm 10.34.7 → verified artifact`
};
function hostContent(){
 const met=scene==='met',failed=scene==='failed',running=scene==='running',unsupported=scene==='unsupported';
 return head('Hosts','Registered machines and their capabilities.')+`<div class="row spread"><span class="muted">2 registered hosts</span><button disabled>+ Add host</button></div><section class="card"><header class="row spread"><div><h2>build-box</h2><small>builder@build-box · Debian / Ubuntu · ~/foom</small></div>${status('done','Ready')}<button disabled>Check capabilities</button></header><div class="row spread"><span class="muted">Host · Tools · Agents</span><span class="done">✓ Host ready · Git ready · Codex ready</span></div><div class="section-label">Repository setup</div><div class="fact"><div><strong>foom</strong><p>Approved list · revision 3</p></div><div>${status(met?'done':running?'':unsupported?'': 'need',met?'Requirements met':running?'Setting up · step 2 of 4':unsupported?'Manual setup required':'Needs setup')}<p>${met?'All approved requirements observed':unsupported?'Requested toolchain version is outside the recipe catalog':'Missing: build-essential, libnss3, Node 24.x, pnpm 10.34.7'}</p></div><div class="actions">${btn('Review list','review')}${met||running||unsupported?'':btn('Set up','running',true)}<button aria-label="Recheck foom setup on build-box" data-go="met" ${running?'disabled':''}>↻</button></div></div><small>Row checked just now · Sources checked at first launch</small><div class="fact"><div><strong>atlas</strong><p>Host requirements unknown</p></div><span class="muted">No setup list</span>${btn('Create list','empty')}</div>${running||failed?`<div class="terminal"><header class="row spread"><strong class="${failed?'failed':''}">${failed?'■ Failed · step 2 of 4 · exit 100':'Setting up foom · step 2 of 4'}</strong>${running?btn('Stop','failed'):btn('Dismiss','hosts')}</header><pre>1  apt-get update → completed\n2  apt-get install -y build-essential libnss3\n${failed?'E: Package download failed.\nLater steps were not started.':'Reading package lists…\n[sudo] password for builder: ▌'}</pre></div>${failed?`<p class="failed">■ Setup failed. Requirements rechecked; 4 items still missing.</p><small>Retry Set up after fixing the failure. Completed requirements will be skipped.</small>`:'<p class="muted">Enter passwords directly here. Leaving Settings asks Stop or Keep open.</p><div class="actions">'+btn('Simulate success','met')+btn('Simulate failed step','failed')+'</div>'}`:''}${scene==='hosts'?`<details><summary>What will Set up do?</summary><div class="steps">${commandSets['Debian / Ubuntu']}</div><p class="muted">Installs only missing requirements. Uses sudo and network downloads. No repository scripts. Pinned toolchains apply to this repository’s launches.</p></details>`:''}${met?`<p class="done">✓ Approved requirements observed. This does not guarantee a successful build.</p>`:''}<div class="footer"><small>Full check · 12 minutes ago<br>Setup rechecks only foom on build-box.</small><small>Checkout preparation happens at launch.</small></div></section><section class="card off"><div class="row spread"><h2>mac-mini</h2><small>macOS</small>${status('done','Ready')}<span>▸</span></div></section>`;
}
function reviewContent(){const stale=scene==='stale';return head('Repository setup','foom · Profile-only list')+btn('← Back to build-box','hosts')+`<section class="card"><header class="row spread"><div><h2>${stale?'Review changed sources':'Review setup draft'}</h2><small>${stale?'Active revision 3 · proposed evidence update':'Agent suggestion · not approved'}</small></div><span class="badge">Saved in Foom’s profile</span></header>${stale?`<div class="notice attention"><strong class="need">◉ Review needed</strong><p><code>package.json</code> now requires Node 26.x; the approved list requires 24.x.</p><small>Set up and new repository agent launches wait for review.</small></div>`:`<p>Approve the host requirements for this repository. Approval installs nothing.</p><small>This sample is a shortened illustrative draft, not Foom’s complete build dependency list.</small>`}<div class="requirement"><strong>OS packages</strong><div><div><b>Debian / Ubuntu</b> · <code>build-essential libnss3</code></div><div><b>RHEL family</b> · <code>gcc gcc-c++ make nss</code></div><div><b>Arch</b> · <code>base-devel nss</code></div><div><b>macOS</b> · <code>pkg-config</code></div><small>Native compilation and Electron runtime libraries. Review every distro mapping.</small></div></div><div class="requirement"><strong>Toolchains</strong><div><code>Node ${stale?'24.x → 26.x':'24.x'}</code><small>Required by package.json engines · ${stale?'Draft change; catalog support must be checked':'Catalog pins an exact release and checksum'}</small><code>pnpm 10.34.7</code><small>Required by package.json packageManager · exact version</small></div></div>${evidence}<details open><summary>Steps and effects</summary><p class="row"><label>Preview distribution <select id="distro">${Object.keys(commandSets).map(x=>`<option>${x}</option>`).join('')}</select></label><small>All four mappings are included in approval.</small></p><div class="steps" id="commands">${commandSets['Debian / Ubuntu']}</div><small>Toolchain helper lines summarize bundled fixed steps; implementation review must show exact pinned version, URL, checksum and argv. Uses network and sudo. Foom’s private toolchain bin is added only to this repository’s launch PATH. No shell startup files are edited.</small></details><div class="footer"><small>${stale?'Changed requirements need a new draft. Keep list is available only after explicitly confirming the requirements are unchanged.':'List source: pasted agent draft · sources fingerprinted at approval.'}</small><div class="actions">${btn('Cancel','hosts')}${stale?btn('Edit draft','review'):btn('Approve list','hosts',true)}</div></div></section>`;}
function emptyContent(){return head('Repository setup','foom · No setup list')+`<section class="card narrow"><h2>What does this repository need?</h2><p class="muted">Add OS packages and toolchain versions. Foom keeps the approved list in its profile, separate from the checkout.</p><div class="notice"><strong>Draft with an agent</strong><p>Ask an existing repository agent to read build docs and manifests, then paste its structured suggestion below.</p><small>The agent keeps its existing permissions. Repository content may reach its model provider. Foom never runs setup from an agent request.</small><p>${btn('Copy draft brief','empty')} <button data-note="Agent selection would open here. No agent is launched by this mockup.">Open repository agent…</button></p></div><label for="draft">Import draft · JSON</label><textarea id="draft" placeholder='{"packages": {...}, "toolchains": [...], "evidence": [...]}'></textarea><p><small>Structured requirements only. Commands, URLs and approval flags are rejected.</small></p><div class="footer"><button data-go="review">Write list</button>${btn('Review sample draft','review',true)}</div></section>`;}
function launchContent(){return head('Launch on build-box','foom / issue-1080')+`<section class="card narrow"><h2>Repository setup is required</h2><div class="big-status need">◉ No agent was started.</div><p>build-box does not meet foom’s approved setup list (revision 3).</p><div class="steps">Missing OS packages\n  build-essential\n  libnss3\n\nMissing toolchains\n  Node 24.x\n  pnpm 10.34.7</div><p class="muted">A user must run Set up in Hosts. After the row meets the list, launch again. Setup will not retry this launch.</p><div class="footer">${btn('Cancel','hosts')}${btn('Open setup','hosts',true)}</div></section>`;}
function render(){document.documentElement.dataset.theme=theme;document.querySelector('#scene').value=scene;document.querySelector('#theme').value=theme;document.querySelector('#repos').classList.toggle('active',['empty','review','stale'].includes(scene));document.querySelector('#hosts').classList.toggle('active',!['empty','review','stale'].includes(scene));main.innerHTML=['review','stale'].includes(scene)?reviewContent():scene==='empty'?emptyContent():scene==='launch'?launchContent():hostContent();main.insertAdjacentHTML('beforeend','<p class="annotation">Design reference · #1080 phase 1 · controls above switch illustrative states.</p>');const url=new URL(location);url.searchParams.set('scene',scene);url.searchParams.set('theme',theme);history.replaceState(null,'',url);}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){if(b.textContent==='Copy draft brief'){await navigator.clipboard.writeText('Read this repository’s build documentation and manifests as text. Do not install anything or request sudo. Propose distro-specific OS packages, required toolchain versions, purposes, evidence paths and uncertainties as structured JSON. Do not include commands, executable paths, URLs, secrets or approval. The user will review and approve the list in Foom.');b.textContent='Brief copied';return;}scene=b.dataset.go;render();}if(b.dataset.note)alert(b.dataset.note);});
document.querySelector('#scene').onchange=e=>{scene=e.target.value;render()};document.querySelector('#theme').onchange=e=>{theme=e.target.value;render()};document.querySelector('#repos').onclick=()=>{scene='empty';render()};document.querySelector('#hosts').onclick=()=>{scene='hosts';render()};document.addEventListener('change',e=>{if(e.target.id==='distro')document.querySelector('#commands').textContent=commandSets[e.target.value]});render();
</script>
</body>
</html>
