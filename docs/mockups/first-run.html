<title>Foom Preflight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: first-run as a launch countdown. Left rail = T-minus checklist, right = the current step. Ends in a go/no-go poll and ignition. */
:root {
  --bg: #eef0f5;
  --panel: #ffffff;
  --raise: #f5f6fa;
  --ink: #171926;
  --muted: #5d6176;
  --faint: #8b8fa3;
  --line: #d9dce5;
  --accent: #5845d6;
  --accent-soft: #ece9ff;
  --accent-ink: #ffffff;
  --go: #16784a;
  --go-bg: #e3f5eb;
  --nogo: #b3261e;
  --nogo-bg: #fbe6e4;
  --flame: #7b6cff;
  --flame-core: #f1eeff;
  --space: #0f1020;
  --space-ink: #e9e8f7;
  --term-bg: #161822;
  --term-fg: #d7d9e4;
  --term-dim: #7e8296;
  --term-ask: #c7bfff;
  --shadow: 0 12px 32px rgba(20, 22, 40, .12), 0 2px 6px rgba(20, 22, 40, .06);
  --display: "Michroma", "Eurostile", "Arial Black", sans-serif;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1017; --panel: #161822; --raise: #1c1f2a; --ink: #e8e9f1; --muted: #9a9eb3; --faint: #6b6f85; --line: #2a2d3b;
    --accent: #8f82ff; --accent-soft: #231f45; --accent-ink: #11111a; --go: #6fe0a3; --go-bg: #13301f; --nogo: #ff8a80; --nogo-bg: #3a1614;
    --flame: #a89cff; --flame-core: #f4f2ff; --space: #07070f; --term-bg: #0c0d12;
    --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1017; --panel: #161822; --raise: #1c1f2a; --ink: #e8e9f1; --muted: #9a9eb3; --faint: #6b6f85; --line: #2a2d3b;
  --accent: #8f82ff; --accent-soft: #231f45; --accent-ink: #11111a; --go: #6fe0a3; --go-bg: #13301f; --nogo: #ff8a80; --nogo-bg: #3a1614;
  --flame: #a89cff; --flame-core: #f4f2ff; --space: #07070f; --term-bg: #0c0d12;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1:focus, h2:focus { outline: none; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: .92em; }

.app { height: 100%; display: grid; grid-template-columns: 260px minmax(0, 1fr); }

/* Rail */
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; padding-left: 6px; }
.brand svg { width: 22px; height: 33px; }
.wordmark { font-family: var(--display); font-size: 18px; letter-spacing: .06em; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border-radius: 8px; border: 0; background: transparent; text-align: left; color: var(--muted); }
.step:disabled { cursor: default; }
.step .t { font-family: var(--display); font-size: 10px; letter-spacing: .08em; color: var(--faint); }
.step .lbl { font-weight: 500; }
.step .ck { font-size: 12px; color: var(--go); font-weight: 600; }
.step.done { color: var(--ink); }
.step.done:hover { background: var(--raise); }
.step.current { background: var(--accent-soft); color: var(--ink); }
.step.current .t { color: var(--accent); }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding-left: 6px; }
.demo-tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 6px; }

/* Stage */
.stage { overflow-y: auto; padding: 40px 32px 32px; }
.inner { max-width: 720px; margin: 0 auto; display: grid; gap: 24px; }
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: .12em; color: var(--accent); }
.head { display: grid; gap: 8px; }
.head h2 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.head p { color: var(--muted); max-width: 62ch; font-size: 15px; }
.nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding-top: 8px; flex-wrap: wrap; }
.nav .why { color: var(--faint); font-size: 13px; }
.btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--raise); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }

.list { display: grid; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 14px 16px; }
.item + .item { border-top: 1px solid var(--line); }
.item .name { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .name code { font-weight: 400; color: var(--muted); }
.item .sub { grid-column: 2 / 4; color: var(--muted); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.item .sig { grid-column: 2 / 4; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.item .sig b { font-weight: 500; }
.tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--raise); color: var(--muted); white-space: nowrap; }
.state { font-size: 12px; font-weight: 600; white-space: nowrap; }
.state.ok { color: var(--go); }
.state.miss { color: var(--nogo); }
.state.scan { color: var(--faint); }
input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.check input { margin-top: 3px; }
.check .t1 { font-weight: 500; }
.check .t2 { color: var(--muted); font-size: 13px; }

.field { display: grid; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.field input, .field select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font-size: 14px; color: var(--ink); min-width: 0; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* Inference options */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.opt input { margin-top: 3px; }
.opt .t1 { font-weight: 600; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.opt .t2 { color: var(--muted); font-size: 13px; }
.opt .rec { font-size: 11px; font-weight: 500; color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt .cfg { grid-column: 2; display: grid; gap: 12px; padding-top: 10px; cursor: default; }
.note { font-size: 13px; color: var(--muted); }

.test { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.test-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.test-head h3 { font-size: 14px; font-weight: 600; }
.tail { background: var(--term-bg); color: var(--term-fg); font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 12px 14px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.tail .d { color: var(--term-dim); }
.tail .q { color: var(--term-ask); }
.result { font-family: var(--mono); font-size: 12px; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.result.ok { background: var(--go-bg); color: var(--ink); }
.result.err { background: var(--nogo-bg); color: var(--nogo); }
.result.run { background: var(--raise); color: var(--muted); }
.privacy { display: grid; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 2px; }

/* Go / no-go poll */
.poll { display: grid; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.poll-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; }
.poll-row + .poll-row { border-top: 1px solid var(--line); }
.poll-row .sys { font-family: var(--display); font-size: 11px; letter-spacing: .08em; }
.poll-row .det { color: var(--muted); font-size: 13px; min-width: 0; }
.pill { font-family: var(--display); font-size: 10px; letter-spacing: .1em; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.pill.go { background: var(--go-bg); color: var(--go); }
.pill.nogo { background: var(--nogo-bg); color: var(--nogo); }

/* Welcome */
.welcome { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; }
.welcome h1 { font-family: var(--display); font-size: clamp(36px, 7vw, 60px); letter-spacing: .04em; line-height: 1; }
.welcome .lede { font-size: 18px; color: var(--ink); max-width: 30ch; margin-top: 16px; letter-spacing: -.01em; }
.welcome .sub { color: var(--muted); max-width: 52ch; margin-top: 10px; }
.welcome .cta { display: flex; gap: 14px; align-items: center; margin-top: 26px; flex-wrap: wrap; }
.welcome .cta span { color: var(--faint); font-size: 13px; }
.hero-rocket { width: 120px; height: 180px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fact { padding: 14px 16px; border-top: 2px solid var(--line); }
.fact b { display: block; font-weight: 600; margin-bottom: 2px; }
.fact span { color: var(--muted); font-size: 13px; }

/* Rocket */
.flame { transform-box: fill-box; transform-origin: 50% 0; animation: flick .18s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scaleY(.9) scaleX(1); } to { transform: scaleY(1.08) scaleX(.94); } }

/* Launch overlay */
.launch { position: fixed; inset: 0; z-index: 30; background: var(--space); color: var(--space-ink); display: grid; place-items: center; overflow: hidden; }
.launch .stars { position: absolute; inset: 0; }
.launch .ship { position: absolute; left: 50%; bottom: 14%; width: 90px; height: 135px; margin-left: -45px; }
.launch.go .ship { animation: rise 2.2s cubic-bezier(.55, 0, .75, .4) .5s forwards; }
.launch .count { font-family: var(--display); font-size: clamp(40px, 10vw, 88px); letter-spacing: .08em; position: relative; }
.launch .count small { display: block; font-size: 12px; letter-spacing: .2em; text-align: center; color: color-mix(in srgb, var(--space-ink) 60%, transparent); margin-top: 12px; }
@keyframes rise { to { transform: translateY(-130vh); } }

/* Landed: empty board */
.board { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.board-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.board-top .led { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); opacity: .5; }
.board-top .muted { color: var(--muted); font-size: 13px; }
.board-body { display: grid; gap: 14px; justify-items: start; padding: 28px 20px; }
.board-body h3 { font-size: 18px; font-weight: 600; }
.board-body p { color: var(--muted); max-width: 56ch; }
.keys { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--raise); color: var(--muted); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.summary div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.summary b { display: block; font-size: 12px; color: var(--faint); font-weight: 500; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; height: auto; min-height: 100%; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; gap: 12px; }
  .steps { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
  .step { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 6px 8px; text-align: center; }
  .step .lbl { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .ck { display: none; }
  .rail-foot { display: none; }
  .stage { padding: 24px 16px; overflow: visible; }
  .welcome { grid-template-columns: minmax(0, 1fr); }
  .hero-rocket { width: 80px; height: 120px; order: -1; }
  .facts, .row2 { grid-template-columns: minmax(0, 1fr); }
  .poll-row { grid-template-columns: minmax(0, 1fr) auto; }
  .poll-row .det { grid-column: 1 / 3; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) {
  .flame { animation: none; }
  .launch.go .ship { animation: none; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="flameGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0" style="stop-color:var(--flame-core)"></stop>
      <stop offset=".35" style="stop-color:var(--flame)"></stop>
      <stop offset="1" style="stop-color:var(--flame);stop-opacity:0"></stop>
    </radialGradient>
    <symbol id="rocket" viewBox="0 0 64 96">
      <g class="flame"><ellipse cx="32" cy="76" rx="9" ry="17" fill="url(#flameGrad)"></ellipse><ellipse cx="32" cy="69" rx="3.2" ry="6" style="fill:var(--flame-core)"></ellipse></g>
      <path d="M20 44 L9 64 L21 59 Z" style="fill:var(--accent)"></path>
      <path d="M44 44 L55 64 L43 59 Z" style="fill:var(--accent)"></path>
      <path d="M32 3 C45 14 47 35 44 59 L20 59 C17 35 19 14 32 3 Z" style="fill:var(--ink)"></path>
      <rect x="25" y="59" width="14" height="5" rx="1.5" style="fill:var(--muted)"></rect>
      <circle cx="32" cy="29" r="5.5" style="fill:var(--flame)"></circle>
      <circle cx="32" cy="29" r="2.4" style="fill:var(--flame-core)"></circle>
    </symbol>
    <symbol id="rocketSpace" viewBox="0 0 64 96">
      <g class="flame"><ellipse cx="32" cy="80" rx="11" ry="22" fill="url(#flameGrad)"></ellipse><ellipse cx="32" cy="70" rx="3.6" ry="8" style="fill:var(--flame-core)"></ellipse></g>
      <path d="M20 44 L9 64 L21 59 Z" style="fill:var(--flame)"></path>
      <path d="M44 44 L55 64 L43 59 Z" style="fill:var(--flame)"></path>
      <path d="M32 3 C45 14 47 35 44 59 L20 59 C17 35 19 14 32 3 Z" style="fill:var(--space-ink)"></path>
      <rect x="25" y="59" width="14" height="5" rx="1.5" style="fill:var(--flame)"></rect>
      <circle cx="32" cy="29" r="5.5" style="fill:var(--space)"></circle>
      <circle cx="32" cy="29" r="2.4" style="fill:var(--flame)"></circle>
    </symbol>
  </defs>
</svg>

<div class="app">
  <aside class="rail">
    <div class="brand"><svg aria-hidden="true"><use href="#rocket"></use></svg><span class="wordmark">foom</span></div>
    <ol class="steps" id="steps"></ol>
    <div class="rail-foot"><span class="demo-tag">Demo</span><br>Scans, keys, and tests are simulated. Nothing leaves this page.</div>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<div class="launch" id="launch" hidden>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>
  <div class="count" id="count" aria-live="assertive"></div>
  <svg class="ship" aria-hidden="true"><use href="#rocketSpace"></use></svg>
</div>

<script>
(() => {
  const STEPS = [
    { t: "", label: "Welcome" },
    { t: "T-3", label: "Agents" },
    { t: "T-2", label: "Repositories" },
    { t: "T-1", label: "Evaluator" },
    { t: "T-0", label: "Go / no-go" },
  ];
  const AGENTS = [
    { id: "claude", name: "Claude Code", cmd: "claude", version: "2.1.4", path: "~/.local/bin/claude",
      signal: "Hooks", detail: "Stop and Notification hooks tell Foom the moment it finishes or asks.", how: "--settings per launch", headless: "claude -p" },
    { id: "codex", name: "Codex", cmd: "codex", version: "0.52.0", path: "/usr/local/bin/codex",
      signal: "Notify", detail: "Codex runs Foom's notifier when a turn completes.", how: "-c notify=… per launch", headless: "codex exec" },
    { id: "agy", name: "Antigravity", cmd: "agy", version: "1.3.0", path: "/usr/local/bin/agy",
      signal: "Evaluator", detail: "No hook support yet, so Foom reads its output when it goes quiet.", how: "output watch", headless: null },
  ];
  const REPOS = [
    { name: "foom", branch: "main", wt: 0 },
    { name: "billing-api", branch: "main", wt: 2 },
    { name: "docs-site", branch: "main", wt: 0 },
    { name: "mobile-app", branch: "develop", wt: 1 },
    { name: "infra", branch: "main", wt: 0 },
  ];
  const PROVIDERS = { anthropic: { label: "Anthropic", model: "claude-haiku-4-5" }, openai: { label: "OpenAI", model: "" }, google: { label: "Google", model: "" } };

  const S = {
    step: 0, reached: 0,
    scan: { claude: "scan", codex: "scan", agy: "scan" }, scanned: false,
    enabled: { claude: true, codex: true, agy: true },
    hooks: true,
    repos: { foom: true, "billing-api": true, "docs-site": false, "mobile-app": true, infra: false },
    folder: "~/code", wtLoc: "home",
    inf: { kind: "cli", cli: "claude", provider: "anthropic", key: "", model: "claude-haiku-4-5", baseUrl: "http://localhost:11434/v1", localModel: "qwen3:8b", redact: true },
    test: null,
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");

  const found = () => AGENTS.filter((a) => S.scan[a.id] === "ok");
  const readyAgents = () => found().filter((a) => S.enabled[a.id]);
  const chosenRepos = () => REPOS.filter((r) => S.repos[r.name]);
  const headlessChoices = () => readyAgents().filter((a) => a.headless);

  function go(n) {
    S.step = n; S.reached = Math.max(S.reached, n); render();
    $("stage").scrollTop = 0;
    const h = $("stage").querySelector("h1, h2"); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  }

  function renderRail() {
    $("steps").innerHTML = STEPS.map((s, i) => {
      const cls = i === S.step ? "current" : i < S.reached || (i <= S.reached && i !== S.step) ? "done" : "";
      const dis = i > S.reached || S.step === 5 ? "disabled" : "";
      return `<li><button class="step ${cls}" data-go="${i}" ${dis} ${i === S.step ? 'aria-current="step"' : ""}>
        <span class="t">${s.t || "&nbsp;"}</span><span class="lbl">${s.label}</span><span class="ck">${i < S.reached && i !== S.step ? "✓" : ""}</span></button></li>`;
    }).join("");
  }

  // ---------- steps ----------
  function welcome() {
    return `<div class="inner">
      <div class="welcome">
        <div>
          <h1>foom</h1>
          <p class="lede">Run ten agents. Hear only from the ones that need you.</p>
          <p class="sub">Every agent gets its own worktree and its own terminal. Terminals stay hidden behind a light. When one stops, Foom works out whether it's done, stuck, or asking you something.</p>
          <div class="cta"><button class="btn primary" data-go="1">Start preflight</button><span>Four checks, about a minute</span></div>
        </div>
        <svg class="hero-rocket" aria-hidden="true"><use href="#rocket"></use></svg>
      </div>
      <div class="facts">
        <div class="fact"><b>Worktrees, not branches</b><span>Agents never step on each other's files.</span></div>
        <div class="fact"><b>Lights, not tabs</b><span>Brightness follows output. Amber means you're needed.</span></div>
        <div class="fact"><b>Hooks first</b><span>Agents that can report their own state do. The evaluator covers the rest.</span></div>
      </div>
    </div>`;
  }

  function agents() {
    const rows = AGENTS.map((a) => {
      const st = S.scan[a.id];
      const stateHtml = st === "scan" ? `<span class="state scan">Looking…</span>` : st === "ok" ? `<span class="state ok">Found</span>` : `<span class="state miss">Not found</span>`;
      const box = `<input type="checkbox" id="ag-${a.id}" data-agent="${a.id}" ${S.enabled[a.id] && st === "ok" ? "checked" : ""} ${st !== "ok" ? "disabled" : ""} aria-label="Use ${a.name}">`;
      const sub = st === "ok" ? `<code>${a.cmd} ${a.version}</code> at <code>${a.path}</code>`
        : st === "miss" ? `<code>${a.cmd}</code> isn't on your PATH. Install it, then <button class="link" data-rescan="${a.id}">scan again</button>.`
        : `Checking your PATH for <code>${a.cmd}</code>`;
      const sig = st === "ok" ? `<div class="sig"><span class="tag">${a.signal}</span><span>${a.detail}</span></div>` : "";
      return `<div class="item">${box}<div class="name">${a.name} <code>${a.cmd}</code></div>${stateHtml}<div class="sub">${sub}</div>${sig}</div>`;
    }).join("");
    const n = readyAgents().length;
    return `<div class="inner">
      <div class="head"><span class="eyebrow">T-3 · Agents</span><h2>Which agents do you run?</h2>
        <p>Foom checks your PATH and picks the most reliable way each agent can tell you it needs attention.</p></div>
      <div class="list">${rows}</div>
      <label class="check" for="hooks"><input type="checkbox" id="hooks" ${S.hooks ? "checked" : ""}>
        <div><div class="t1">Attach Foom's hooks when it launches an agent</div>
        <div class="t2">Passed per launch (<code>claude --settings</code>, <code>codex -c notify=…</code>). Your own config files are never edited. Turn this off and every agent falls back to the evaluator.</div></div></label>
      <div class="nav"><button class="btn" data-go="0">Back</button>
        <span class="why">${n ? `${n} agent${n > 1 ? "s" : ""} ready` : "Enable at least one agent"}</span>
        <button class="btn primary" data-go="2" ${n ? "" : "disabled"}>Continue</button></div>
    </div>`;
  }

  function repos() {
    const first = chosenRepos()[0]?.name || "foom";
    const where = S.wtLoc === "home" ? `~/.foom/worktrees/${first}/feat-search` : `~/code/${first}-feat-search`;
    const rows = REPOS.map((r) => `<label class="item" for="rp-${r.name}"><input type="checkbox" id="rp-${r.name}" data-repo="${r.name}" ${S.repos[r.name] ? "checked" : ""}>
      <div class="name"><span class="mono">${r.name}</span></div><span class="tag">${esc(r.branch)}</span>
      <div class="sub">${esc(S.folder)}/${r.name}${r.wt ? ` · ${r.wt} existing worktree${r.wt > 1 ? "s" : ""}, Foom will list them` : ""}</div></label>`).join("");
    const n = chosenRepos().length;
    return `<div class="inner">
      <div class="head"><span class="eyebrow">T-2 · Repositories</span><h2>Where do your repos live?</h2>
        <p>Pick the repos you'll start agents in. You can add more any time.</p></div>
      <div class="row2"><label class="field" for="folder">Folder to scan<input id="folder" class="mono" value="${esc(S.folder)}"></label>
        <div class="field"><span>&nbsp;</span><button class="btn" id="rescanRepos" type="button">Scan folder</button></div></div>
      <div class="list" id="repoList">${rows}</div>
      <div class="opts" role="radiogroup" aria-label="Where new worktrees go">
        <label class="opt" for="wt-home"><input type="radio" name="wt" id="wt-home" value="home" ${S.wtLoc === "home" ? "checked" : ""}>
          <div><div class="t1">Keep worktrees in Foom's folder <span class="rec">Recommended</span></div><div class="t2">Your code folder stays tidy, and Foom can clean up merged worktrees in one place.</div></div></label>
        <label class="opt" for="wt-sib"><input type="radio" name="wt" id="wt-sib" value="sibling" ${S.wtLoc === "sibling" ? "checked" : ""}>
          <div><div class="t1">Put them next to each repo</div><div class="t2">Easier to find in your editor and shell history.</div></div></label>
      </div>
      <p class="note">A branch named <code>feat/search</code> would land at <code>${esc(where)}</code></p>
      <div class="nav"><button class="btn" data-go="1">Back</button>
        <span class="why">${n ? `${n} repo${n > 1 ? "s" : ""} selected` : "Select at least one repo"}</span>
        <button class="btn primary" data-go="3" ${n ? "" : "disabled"}>Continue</button></div>
    </div>`;
  }

  function evaluator() {
    const i = S.inf, hc = headlessChoices();
    if (i.kind === "cli" && !hc.length) i.kind = "api";
    if (i.kind === "cli" && !hc.some((a) => a.id === i.cli)) i.cli = hc[0].id;
    const opt = (kind, title, desc, cfg, rec) => `<label class="opt" for="inf-${kind}"><input type="radio" name="inf" id="inf-${kind}" value="${kind}" ${i.kind === kind ? "checked" : ""} ${kind === "cli" && !hc.length ? "disabled" : ""}>
      <div><div class="t1">${title}${rec ? ` <span class="rec">Recommended</span>` : ""}</div><div class="t2">${desc}</div></div>
      ${i.kind === kind && cfg ? `<div class="cfg">${cfg}</div>` : ""}</label>`;

    const cliCfg = `<label class="field" for="cli">Agent<select id="cli">${hc.map((a) => `<option value="${a.id}" ${i.cli === a.id ? "selected" : ""}>${a.name} (${a.headless})</option>`).join("")}</select></label>
      <p class="note">Uses the login you already have, so no key is stored. Checks count toward that plan's usage.</p>`;
    const apiCfg = `<div class="row2"><label class="field" for="prov">Provider<select id="prov">${Object.entries(PROVIDERS).map(([k, p]) => `<option value="${k}" ${i.provider === k ? "selected" : ""}>${p.label}</option>`).join("")}</select></label>
      <label class="field" for="model">Model<input id="model" class="mono" value="${esc(i.model)}" placeholder="A small, fast model"></label></div>
      <label class="field" for="key">API key<input id="key" type="password" autocomplete="off" value="${esc(i.key)}" placeholder="Paste a key"></label>
      <p class="note">Stored in your system keychain. Foom never writes it to disk in plain text.</p>`;
    const localCfg = `<div class="row2"><label class="field" for="base">Base URL<input id="base" class="mono" value="${esc(i.baseUrl)}"></label>
      <label class="field" for="lmodel">Model<input id="lmodel" class="mono" value="${esc(i.localModel)}"></label></div>
      <p class="note">Any OpenAI-compatible server: Ollama, LM Studio, vLLM. Nothing leaves your machine.</p>`;

    return `<div class="inner">
      <div class="head"><span class="eyebrow">T-1 · Evaluator</span><h2>How should Foom read a terminal that goes quiet?</h2>
        <p>Hooks and simple rules handle most cases. When output is ambiguous, like an agent asking a question in plain prose, Foom asks a model. Pick where that model runs.</p></div>
      <div class="opts" role="radiogroup" aria-label="Inference source">
        ${opt("cli", "Use an agent you already have", hc.length ? "Foom runs a one-shot, headless call through your existing agent CLI." : "None of your enabled agents has a headless mode.", cliCfg, true)}
        ${opt("api", "Use an API key", "Direct calls to a provider. Fastest and cheapest per check.", apiCfg)}
        ${opt("local", "Use a local model", "Runs on your machine through an OpenAI-compatible endpoint.", localCfg)}
        ${opt("none", "Rules only", "No model. Ambiguous terminals stay neutral instead of turning amber.", "")}
      </div>
      <div class="test">
        <div class="test-head"><h3>Try it on a sample</h3><button class="btn small" id="runTest" type="button">Run check</button></div>
        <div class="tail"><span class="d">● Update(src/invoices/pdf.ts)
  ⎿ +118 lines</span>
● Invoice numbers are global today (INV-004213).
<span class="q">● Before I change the header: should invoice numbers reset each year, or keep counting?</span></div>
        <div id="testOut">${testHtml()}</div>
      </div>
      <div class="privacy">
        <label class="check" for="redact"><input type="checkbox" id="redact" ${i.redact ? "checked" : ""}>
          <div><div class="t1">Redact likely secrets before sending</div><div class="t2">Tokens, keys, and passwords in the output are replaced with <code>[redacted]</code>.</div></div></label>
        <p>Foom sends the last 40 lines of a terminal that has been quiet for a few seconds. It never sends files, diffs, or your keystrokes.</p>
      </div>
      <div class="nav"><button class="btn" data-go="2">Back</button><span class="why">You can add more sources later in Settings</span>
        <button class="btn primary" data-go="4">Continue</button></div>
    </div>`;
  }

  function testHtml() {
    const t = S.test;
    if (!t) return `<div class="result run">Not run yet.</div>`;
    return `<div class="result ${t.cls}">${esc(t.text)}</div>`;
  }

  function runTest() {
    const i = S.inf;
    if (i.kind === "api" && !i.key.trim()) { S.test = { cls: "err", text: "Paste an API key first." }; return paintTest(); }
    if (i.kind === "api" && !i.model.trim()) { S.test = { cls: "err", text: "Enter a model id for this provider." }; return paintTest(); }
    if (i.kind === "local" && !/^https?:\/\//.test(i.baseUrl)) { S.test = { cls: "err", text: "Base URL must start with http:// or https://" }; return paintTest(); }
    if (i.kind === "local" && !i.localModel.trim()) { S.test = { cls: "err", text: "Enter the model name your server exposes." }; return paintTest(); }
    const via = i.kind === "cli" ? AGENTS.find((a) => a.id === i.cli).headless : i.kind === "api" ? `${PROVIDERS[i.provider].label} · ${i.model}` : i.kind === "local" ? `${i.baseUrl} · ${i.localModel}` : "rules";
    S.test = { cls: "run", text: `Checking with ${via}…` }; paintTest();
    const ms = i.kind === "cli" ? 1800 : i.kind === "local" ? 1100 : i.kind === "api" ? 700 : 200;
    setTimeout(() => {
      if (i.kind === "none") S.test = { cls: "ok", text: `No rule matched (no y/n, no password prompt, no exit).\n→ stays neutral. A model would flag this one.` };
      else S.test = { cls: "ok", text: `{ "state": "needs_input",\n  "reason": "Asking whether invoice numbers reset yearly",\n  "confidence": 0.94 }\n${via} · ${(ms / 1000 + Math.random() * .3).toFixed(1)}s` };
      paintTest();
    }, ms);
  }
  function paintTest() { const o = $("testOut"); if (o) o.innerHTML = testHtml(); }

  function infSummary() {
    const i = S.inf;
    if (i.kind === "cli") return `${AGENTS.find((a) => a.id === i.cli).headless} (your existing login)`;
    if (i.kind === "api") return `${PROVIDERS[i.provider].label} API · ${i.model || "no model set"}`;
    if (i.kind === "local") return `Local · ${i.localModel}`;
    return "Rules only. Ambiguous terminals stay neutral";
  }
  function pollRows() {
    const ra = readyAgents(), rr = chosenRepos(), i = S.inf;
    const infGo = i.kind === "none" || i.kind === "cli" || (i.kind === "api" ? !!(i.key.trim() && i.model.trim()) : !!(i.baseUrl && i.localModel));
    return [
      { sys: "Agents", go: ra.length > 0, det: ra.length ? ra.map((a) => a.name).join(", ") : "None enabled", back: 1 },
      { sys: "Signals", go: true, det: ra.map((a) => `${a.name}: ${S.hooks && a.signal !== "Evaluator" ? a.signal.toLowerCase() : "evaluator"}`).join(" · ") || "n/a", back: 1 },
      { sys: "Repositories", go: rr.length > 0, det: rr.length ? rr.map((r) => r.name).join(", ") : "None selected", back: 2 },
      { sys: "Worktrees", go: true, det: S.wtLoc === "home" ? "~/.foom/worktrees" : "Next to each repo", back: 2 },
      { sys: "Evaluator", go: infGo, det: infGo ? infSummary() : i.kind === "api" ? "API key or model missing" : "Endpoint incomplete", back: 3 },
    ];
  }
  function poll() {
    const rows = pollRows(), allGo = rows.every((r) => r.go);
    return `<div class="inner">
      <div class="head"><span class="eyebrow">T-0 · Go / no-go</span><h2>${allGo ? "All stations go." : "Hold. Something needs fixing."}</h2>
        <p>${allGo ? "Everything checks out. Launch to open your board." : "Fix the no-go items below. Click one to jump back to it."}</p></div>
      <div class="poll">${rows.map((r) => `<div class="poll-row"><span class="sys">${r.sys.toUpperCase()}</span><span class="det">${esc(r.det)}${r.go ? "" : ` · <button class="link" data-go="${r.back}">Fix</button>`}</span>
        <span class="pill ${r.go ? "go" : "nogo"}">${r.go ? "GO" : "NO-GO"}</span></div>`).join("")}</div>
      <div class="nav"><button class="btn" data-go="3">Back</button><span></span>
        <button class="btn primary" id="launchBtn" ${allGo ? "" : "disabled"}>Launch</button></div>
    </div>`;
  }

  function landed() {
    const ra = readyAgents(), rr = chosenRepos();
    return `<div class="inner">
      <div class="head"><span class="eyebrow">Liftoff</span><h2>You're in orbit.</h2>
        <p>This is your board. Every terminal you start shows up here as a light.</p></div>
      <div class="board">
        <div class="board-top"><span class="led"></span><span class="wordmark" style="font-size:14px">foom</span><span class="muted">0 working · nothing needs you</span></div>
        <div class="board-body">
          <h3>No terminals yet</h3>
          <p>Create a worktree to start your first agent. Foom makes the branch, opens a terminal in it, and hands the task to the agent you pick.</p>
          <button class="btn primary" type="button">New worktree</button>
          <div class="keys"><span><kbd>N</kbd> next that needs you</span><span><kbd>Esc</kbd> hide terminal</span><span><kbd>⌘ K</kbd> new worktree</span></div>
        </div>
      </div>
      <div class="summary">
        <div><b>Agents</b>${ra.map((a) => a.name).join(", ")}</div>
        <div><b>Repositories</b>${rr.map((r) => r.name).join(", ")}</div>
        <div><b>Evaluator</b>${esc(infSummary())}</div>
      </div>
      <div class="nav"><span></span><button class="btn" id="restart" type="button">Restart demo</button></div>
    </div>`;
  }

  function render() {
    renderRail();
    const html = [welcome, agents, repos, evaluator, poll, landed][S.step]();
    $("stage").innerHTML = html;
    if (S.step === 1 && !S.scanned) startScan();
  }

  // ---------- behavior ----------
  function startScan(only) {
    S.scanned = true;
    const ids = only ? [only] : AGENTS.map((a) => a.id);
    ids.forEach((id, n) => {
      S.scan[id] = "scan";
      setTimeout(() => {
        // Demo: agy is missing on first scan and found on rescan.
        S.scan[id] = id === "agy" && !only ? "miss" : "ok";
        if (S.step === 1) render();
      }, only ? 900 : 500 + n * 450);
    });
    if (only && S.step === 1) render();
  }

  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g && !g.disabled) { e.preventDefault(); go(Number(g.dataset.go)); return; }
    const r = e.target.closest("[data-rescan]");
    if (r) { e.preventDefault(); startScan(r.dataset.rescan); return; }
    if (e.target.id === "runTest") runTest();
    if (e.target.id === "launchBtn") launch();
    if (e.target.id === "restart") restart();
    if (e.target.id === "rescanRepos") { const l = $("repoList"); l.style.opacity = ".4"; setTimeout(() => { l.style.opacity = ""; }, 600); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.agent) { S.enabled[t.dataset.agent] = t.checked; render(); }
    else if (t.id === "hooks") S.hooks = t.checked;
    else if (t.dataset.repo) { S.repos[t.dataset.repo] = t.checked; render(); }
    else if (t.name === "wt") { S.wtLoc = t.value; render(); }
    else if (t.name === "inf") { S.inf.kind = t.value; S.test = null; render(); }
    else if (t.id === "cli") { S.inf.cli = t.value; S.test = null; }
    else if (t.id === "prov") { S.inf.provider = t.value; S.inf.model = PROVIDERS[t.value].model; S.test = null; render(); }
    else if (t.id === "redact") S.inf.redact = t.checked;
  });
  document.addEventListener("input", (e) => {
    const t = e.target, map = { key: "key", model: "model", base: "baseUrl", lmodel: "localModel" };
    if (map[t.id]) { S.inf[map[t.id]] = t.value; S.test = null; paintTest(); }
    if (t.id === "folder") S.folder = t.value || "~/code";
  });

  // ---------- launch ----------
  let starTimer;
  function drawStars(speed) {
    const c = $("stars"), ctx = c.getContext("2d"), dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    const ink = getComputedStyle(document.documentElement).getPropertyValue("--space-ink").trim() || "#fff";
    const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.4 * dpr + .3, v: Math.random() * .8 + .2 }));
    let vy = 0;
    cancelAnimationFrame(starTimer);
    const tick = () => {
      ctx.clearRect(0, 0, c.width, c.height); ctx.fillStyle = ink;
      vy = Math.min(vy + speed(), 26 * dpr);
      for (const s of stars) {
        s.y += vy * s.v; if (s.y > c.height) { s.y -= c.height; s.x = Math.random() * c.width; }
        ctx.globalAlpha = .35 + s.v * .6; ctx.fillRect(s.x, s.y, s.r, s.r + vy * s.v * .6);
      }
      starTimer = requestAnimationFrame(tick);
    };
    tick();
  }
  function launch() {
    const L = $("launch"), count = $("count");
    L.hidden = false; L.classList.remove("go");
    if (reduce.matches) {
      count.innerHTML = `foom<small>LAUNCHED</small>`;
      setTimeout(() => { L.hidden = true; go(5); }, 1200);
      return;
    }
    let lift = false;
    drawStars(() => (lift ? .5 : 0));
    const seq = ["3", "2", "1"];
    let n = 0;
    count.innerHTML = `${seq[0]}<small>T-MINUS</small>`;
    const iv = setInterval(() => {
      n++;
      if (n < seq.length) { count.innerHTML = `${seq[n]}<small>T-MINUS</small>`; return; }
      clearInterval(iv);
      count.innerHTML = `foom<small>TAKEOFF: FAST</small>`;
      L.classList.add("go"); lift = true;
      setTimeout(() => { cancelAnimationFrame(starTimer); L.hidden = true; go(5); }, 3000);
    }, 700);
  }
  function restart() {
    Object.assign(S, { step: 0, reached: 0, scanned: false, test: null, scan: { claude: "scan", codex: "scan", agy: "scan" } });
    render();
  }

  render();
})();
</script>
