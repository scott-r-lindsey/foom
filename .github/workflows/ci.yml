name: CI

# Windows and macOS minutes cost 2× and 10× Linux. Pull requests run Linux only;
# label one `full-ci` to add Windows and macOS. Pushes to main, nightly runs (when
# main changed) and manual runs validate every platform. Draft pull requests skip
# CI until they are marked ready for review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      upload_packages:
        description: Upload unsigned development ZIPs (retained for 3 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Manual runs and unrelated label events must not cancel a run in progress.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  checks:
    name: Static checks and change detection
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
      desktop_matrix: ${{ steps.changes.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit
      - run: npm run test:ci
      - name: Detect changes requiring desktop validation
        id: changes
        run: node scripts/ci-changes.mjs
      - name: Check committed whitespace
        run: git show --format= --check HEAD

  unit:
    name: Unit tests and coverage
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotePath=false diff --unified=0 --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > coverage/changed-lines.diff
          node scripts/report-changed-coverage.mjs coverage/lcov.info coverage/changed-lines.diff coverage/changed-lines.md
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node scripts/format-coverage-summary.mjs coverage/coverage-summary.json coverage/summary.md
          if [ -f coverage/changed-lines.md ]; then
            printf '\n' >> coverage/summary.md
            cat coverage/changed-lines.md >> coverage/summary.md
          fi
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR coverage comment
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('coverage/summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- foom-coverage -->';
            const body = fs.readFileSync('coverage/summary.md', 'utf8');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Electron (${{ matrix.os }}, ${{ matrix.shard }})
    needs: [checks, unit]
    if: needs.checks.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.desktop_matrix) }}
    env:
      FOOM_ELECTRON_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test hooks and control storage with native OS tools
        if: matrix.shard != '2/2'
        # Cold PowerShell probes compete for startup when these files run together.
        # Exercise native transport once per platform, with one OS probe at a time.
        run: npx vitest run --no-file-parallelism tests/unit/main/agents/hook-receiver.test.ts tests/unit/main/agents/hook-adapters.test.ts tests/unit/main/agents/hook-launch.test.ts tests/unit/main/control/private-native.test.ts
      - name: Test Git inventory paths on native filesystem
        if: matrix.shard != '2/2'
        run: npx vitest run --no-file-parallelism tests/unit/main/workspace/worktrees.test.ts tests/unit/main/workspace/inventory-watch.test.ts -t 'derives watch directories|validates paths'
      - name: Prepare Linux display and sandbox
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          # Hosted images usually already contain these. Avoid contacting a stale
          # mirror when nothing needs installing; bound network waits otherwise.
          missing=()
          for package in xvfb libgtk-3-0t64 libnss3 libasound2t64; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y "${missing[@]}"
          fi
          # Permit Chromium's user-namespace sandbox on this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The full suite includes preflight and sidebar flows; per-test deadlines
      # and the Electron worker watchdog still bound individual hangs.
      - name: Test Electron on Linux
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - name: Test Electron on macOS and Windows
        # A measured full Windows suite exceeded 10 minutes without a test failure.
        # Two disjoint shards run every test once, in separate runner processes.
        # Individual launches and waits use the shared platform deadline policy.
        timeout-minutes: 10
        if: runner.os != 'Linux'
        run: npm run test:electron
      - name: Package desktop application
        if: matrix.shard != '2/2'
        run: npm run make
      - name: Test packaged terminal host on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Test packaged terminal host on macOS and Windows
        if: runner.os != 'Linux' && matrix.shard != '2/2'
        run: npm run test:packaged
      - name: Upload Electron timing and process diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: electron-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsigned development package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_packages && matrix.shard != '2/2'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: foom-${{ matrix.os }}
          path: out/make/**/*.zip
          if-no-files-found: error
          retention-days: 3

  quality:
    name: Quality gate
    if: always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    needs: [checks, unit, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_REQUIRED: ${{ needs.checks.outputs.desktop_required }}
        run: |
          test "$CHECKS" = success
          test "$UNIT" = success
          case "$DESKTOP_REQUIRED:$DESKTOP" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
