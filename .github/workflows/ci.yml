name: CI

# Every pull request push, drafts included, validates Linux, Windows and macOS so
# platform failures surface while the work is in progress. A newer push cancels
# the branch's previous run. Nightly runs validate main only when it changed.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish tested main packages to the rolling nightly prerelease
        type: boolean
        default: false
      upload_packages:
        description: Upload unsigned development ZIPs (retained for 3 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Manual runs must not cancel a run in progress.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  # Desktop jobs need only this fast job, so they start alongside static checks.
  changes:
    name: Change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
      desktop_matrix: ${{ steps.changes.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Detect changes requiring desktop validation
        id: changes
        run: node scripts/ci-changes.mjs

  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit
      - run: npm run test:ci
      - name: Check committed whitespace
        run: git show --format= --check HEAD

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotePath=false diff --unified=0 --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > coverage/changed-lines.diff
          node scripts/report-changed-coverage.mjs coverage/lcov.info coverage/changed-lines.diff coverage/changed-lines.md
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node scripts/format-coverage-summary.mjs coverage/coverage-summary.json coverage/summary.md
          if [ -f coverage/changed-lines.md ]; then
            printf '\n' >> coverage/summary.md
            cat coverage/changed-lines.md >> coverage/summary.md
          fi
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR coverage comment
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('coverage/summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- foom-coverage -->';
            const body = fs.readFileSync('coverage/summary.md', 'utf8');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Electron (${{ matrix.os }}, ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    env:
      FOOM_ELECTRON_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare Electron binary
        timeout-minutes: 3
        # Electron 44 can download lazily on require; keep network setup outside
        # the first Playwright launch deadline and the desktop test budget.
        run: node -e "require('electron')"
      - name: Prepare Windows PowerShell runtime
        if: runner.os == 'Windows' && matrix.shard != '2/2'
        timeout-minutes: 3
        # Run 37728101831: first native probe exhausted 8s; the next complete
        # policy/transport case took 5.4s. Warm runtime startup separately from
        # bounded hook/policy assertions, without retries or relaxed probe limits.
        run: powershell.exe -NoProfile -NonInteractive -Command "exit 0"
      - name: Test hooks and control storage with native OS tools
        if: matrix.shard != '2/2'
        # Cold PowerShell probes compete for startup when these files run together.
        # Exercise native transport once per platform, with one OS probe at a time.
        run: npx vitest run --no-file-parallelism tests/unit/main/agents/hook-receiver.test.ts tests/unit/main/agents/hook-adapters.test.ts tests/unit/main/agents/agy-observer.test.ts tests/unit/main/agents/hook-launch.test.ts tests/unit/main/control/private-native.test.ts
      - name: Test Git inventory paths on native filesystem
        if: matrix.shard != '2/2'
        run: npx vitest run --no-file-parallelism tests/unit/main/workspace/worktrees.test.ts tests/unit/main/workspace/inventory-watch.test.ts -t 'derives watch directories|validates paths'
      - name: Prepare Linux display and sandbox
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          # Hosted images usually already contain these. Avoid contacting a stale
          # mirror when nothing needs installing; bound network waits otherwise.
          missing=()
          for package in xvfb libgtk-3-0t64 libnss3 libasound2t64; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y "${missing[@]}"
          fi
          # Permit Chromium's user-namespace sandbox on this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The full suite includes preflight and sidebar flows; per-test deadlines
      # and the Electron worker watchdog still bound individual hangs.
      - name: Test Electron on Linux
        # Run 37725461331 reached 300s before the last menu cases and report flush.
        # Keep per-test deadlines; allow the measured full suite plus cleanup.
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - name: Test Electron on macOS and Windows
        # A measured full Windows suite exceeded 10 minutes without a test failure.
        # Two disjoint shards run every test once, in separate runner processes.
        # Individual launches and waits use the shared platform deadline policy.
        # Run 37880529037: macOS passed 54 cases (580s total) before the 600s
        # suite cutoff interrupted the final window cases and JUnit flush.
        # Allow the measured suite plus custom-theme coverage; keep per-test limits.
        timeout-minutes: ${{ runner.os == 'macOS' && 12 || 10 }}
        if: runner.os != 'Linux'
        run: npm run test:electron
      - name: Stamp nightly package version
        if: >-
          matrix.shard != '2/2' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
        run: node scripts/nightly.mjs stamp
      - name: Package desktop application
        if: matrix.shard != '2/2'
        run: npm run make
      - name: Verify macOS ad-hoc signature after packaging and fuses
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict out/Foom-darwin-arm64/Foom.app
      - name: Test packaged terminal host on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Test packaged terminal host on macOS and Windows
        if: runner.os != 'Linux' && matrix.shard != '2/2'
        run: npm run test:packaged
      - name: Upload Electron timing and process diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: electron-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsigned development package
        if: >-
          matrix.shard != '2/2' &&
          ((github.event_name == 'workflow_dispatch' && inputs.upload_packages) ||
          (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))))
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: foom-${{ matrix.os }}
          path: out/make/**/*.zip
          if-no-files-found: error
          retention-days: 3

  quality:
    name: Quality gate
    if: always()
    needs: [changes, checks, unit, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop_required }}
        run: |
          test "$CHANGES" = success
          test "$CHECKS" = success
          test "$UNIT" = success
          case "$DESKTOP_REQUIRED:$DESKTOP" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  nightly:
    name: Publish nightly
    needs: [changes, quality]
    if: >-
      needs.quality.result == 'success' && needs.changes.outputs.desktop_required == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Download this run's tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name foom-ubuntu-24.04 --name foom-windows-2025 --name foom-macos-15 --dir nightly-packages
      - name: Publish rolling prerelease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/nightly.mjs`);
            await publish({ github, context });
