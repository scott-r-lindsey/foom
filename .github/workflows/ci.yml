name: CI

# Every pull request push, drafts included, validates Linux, Windows and macOS so
# platform failures surface while the work is in progress. A newer push cancels
# the branch's previous run. Nightly runs validate main only when it changed.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      claude_version:
        description: MCP probe Claude Code version (latest or stable x.y.z)
        type: string
        default: latest
      codex_version:
        description: MCP probe Codex version (latest or stable x.y.z)
        type: string
        default: latest
      publish_nightly:
        description: Publish tested main packages to the rolling nightly prerelease
        type: boolean
        default: false
      check_macos_credentials:
        description: Check Release Apple credentials on main without building or uploading
        type: boolean
        default: false
      upload_packages:
        description: Upload unsigned development ZIPs (retained for 3 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Scheduled/manual runs have isolated groups so pushes cannot interrupt publication.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  HUSKY: '0'

jobs:
  # Desktop jobs need only this fast job, so they start alongside static checks.
  changes:
    name: Change detection
    if: github.event_name != 'workflow_dispatch' || !inputs.check_macos_credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
      desktop_matrix: ${{ steps.changes.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Detect changes requiring desktop validation
        id: changes
        run: node scripts/ci-changes.mjs

  checks:
    name: Static checks
    if: github.event_name != 'workflow_dispatch' || !inputs.check_macos_credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run docs:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run audit
      - run: pnpm run test:ci
      - name: Check committed whitespace
        run: git show --format= --check HEAD

  unit:
    name: Unit tests and coverage
    if: github.event_name != 'workflow_dispatch' || !inputs.check_macos_credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotePath=false diff --unified=0 --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > coverage/changed-lines.diff
          node scripts/report-changed-coverage.mjs coverage/lcov.info coverage/changed-lines.diff coverage/changed-lines.md
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node scripts/format-coverage-summary.mjs coverage/coverage-summary.json coverage/summary.md
          if [ -f coverage/changed-lines.md ]; then
            printf '\n' >> coverage/summary.md
            cat coverage/changed-lines.md >> coverage/summary.md
          fi
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR coverage comment
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('coverage/summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- foom-coverage -->';
            const body = fs.readFileSync('coverage/summary.md', 'utf8');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Electron (${{ matrix.os }}, ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    env:
      FOOM_ELECTRON_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron binary
        timeout-minutes: 3
        # Electron 44 can download lazily on require; keep network setup outside
        # the first Playwright launch deadline and the desktop test budget.
        run: node -e "require('electron')"
      - name: Prepare Linux display and sandbox
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          # Hosted images usually already contain these. Avoid contacting a stale
          # mirror when nothing needs installing; bound network waits otherwise.
          missing=()
          for package in xvfb libgtk-3-0t64 libnss3 libasound2t64; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y "${missing[@]}"
          fi
          # Permit Chromium's user-namespace sandbox on this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The full suite runs as four disjoint, duration-balanced named-test shards.
      # See docs/electron-shards.md for measurements and the checked-in plan.
      # Per-test deadlines and the Electron worker watchdog still bound hangs.
      - name: Test Electron on Linux
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:electron
      - name: Test Electron on macOS and Windows
        timeout-minutes: 14
        if: runner.os != 'Linux'
        run: pnpm run test:electron
      - name: Upload Electron timing and process diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: electron-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  remote-host:
    name: Remote host (${{ matrix.target }})
    needs: [changes]
    if: needs.changes.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp nightly host version identically to the app
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
        run: node scripts/nightly.mjs stamp
      - name: Build native host, ad-hoc sign Darwin and measure gzip
        env:
          FOOM_REMOTE_HOST_OUTPUT: remote-host-artifacts
        run: node scripts/build-remote-host.mjs
      - name: Verify native SEA startup without a host or network
        # Invalid arguments must reach our entry point (exit 2), not Node itself.
        shell: bash
        run: |
          set +e
          output=$(remote-host-artifacts/${{ matrix.target }}/foom-host --invalid 2>&1)
          status=$?
          set -e
          test "$status" = 2
          test "$output" = "Usage: foom-host --daemon|--connect"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: remote-host-${{ matrix.target }}
          path: |
            remote-host-artifacts/${{ matrix.target }}/foom-host.gz
            remote-host-artifacts/${{ matrix.target }}/manifest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  platform:
    name: Native checks and packaging (${{ matrix.os }})
    needs: [changes, remote-host]
    if: needs.changes.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron binary
        timeout-minutes: 3
        # Electron 44 can download lazily on require; keep network setup outside
        # the first Playwright launch deadline and the desktop test budget.
        run: node -e "require('electron')"
      - name: Prepare Windows PowerShell runtime
        if: runner.os == 'Windows'
        timeout-minutes: 3
        # Run 37728101831: first native probe exhausted 8s; the next complete
        # policy/transport case took 5.4s. Warm runtime startup separately from
        # bounded hook/policy assertions, without retries or relaxed probe limits.
        run: powershell.exe -NoProfile -NonInteractive -Command "exit 0"
      - name: Test hooks and control storage with native OS tools
        # Cold PowerShell probes compete for startup when these files run together.
        # Exercise native transport once per platform, with one OS probe at a time.
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/hooks.xml --no-file-parallelism tests/unit/main/login-shell.test.ts tests/unit/main/agents/hook-receiver.test.ts tests/unit/main/agents/hook-adapters.test.ts tests/unit/main/agents/agy-observer.test.ts tests/unit/main/agents/hook-launch.test.ts tests/unit/main/agents/codex-hooks.test.ts tests/unit/main/agents/v2-native.test.ts tests/unit/main/control/private-native.test.ts tests/unit/main/update-package.test.ts
      - name: Test Antigravity observer alone
        run: pnpm test tests/unit/main/agents/agy-observer.test.ts --reporter=default --reporter=junit --outputFile.junit=test-results/agy-observer.xml
      - name: Test Git inventory paths on native filesystem
        run: pnpm test --no-file-parallelism tests/unit/main/workspace/worktrees.test.ts tests/unit/main/workspace/inventory-watch.test.ts -t 'derives watch directories|validates paths'
      - name: Test preview containment on native filesystem
        # Windows junction tests must run on Windows, not just the Linux unit job.
        run: pnpm test tests/unit/main/previews --reporter=default --reporter=junit --outputFile.junit=test-results/previews.xml
      - name: Prepare Linux display and sandbox
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          # Hosted images usually already contain these. Avoid contacting a stale
          # mirror when nothing needs installing; bound network waits otherwise.
          missing=()
          for package in xvfb libgtk-3-0t64 libnss3 libasound2t64 rpm cpio; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y "${missing[@]}"
          fi
          # Permit Chromium's user-namespace sandbox on this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Stamp nightly package version
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
        run: node scripts/nightly.mjs stamp
      - name: Download all four same-commit host builds
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v4
        with:
          pattern: remote-host-*
          path: .cache/remote-host-download
      - name: Assemble native host catalog
        shell: bash
        run: |
          mkdir -p .cache/remote-hosts
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mv ".cache/remote-host-download/remote-host-$target" ".cache/remote-hosts/$target"
          done
      - name: Package desktop application
        run: pnpm run make
      - name: Verify macOS ad-hoc signature after packaging and fuses
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict out/Foom-darwin-arm64/Foom.app
      - name: Test packaged terminal host on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:packaged
      - name: Test packaged terminal host on macOS and Windows
        if: runner.os != 'Linux'
        run: pnpm run test:packaged
      - name: Test installer payloads on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:installers
      - name: Test installer payloads on macOS and Windows
        if: runner.os != 'Linux'
        run: pnpm run test:installers
      - name: Upload tested installer and ZIP artifacts
        if: >-
          runner.os == 'macOS' || github.ref == 'refs/heads/main' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_packages)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Foom-${{ matrix.os }}
          path: out/make/
          if-no-files-found: error
          retention-days: 3
      - name: Download tested macOS artifact for ad-hoc signing
        if: runner.os == 'macOS'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v4
        with:
          name: Foom-macos-15
          path: tested-macos
      - name: Exercise tested-ZIP signing path ad-hoc without Apple credentials
        if: runner.os == 'macOS'
        run: node scripts/macos-sign.mjs adhoc-zip tested-macos "$RUNNER_TEMP/adhoc-signed"
      - name: Remove ad-hoc ZIP signing scratch
        if: always() && runner.os == 'macOS'
        run: node scripts/macos-credentials.mjs cleanup
      - name: Upload native and packaged timing and process diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: error
          retention-days: 3

  quality:
    name: Quality gate
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.check_macos_credentials)
    needs: [changes, checks, unit, desktop, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          DESKTOP: ${{ needs.desktop.result }}
          PLATFORM: ${{ needs.platform.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop_required }}
        run: |
          test "$CHANGES" = success
          test "$CHECKS" = success
          test "$UNIT" = success
          case "$DESKTOP_REQUIRED:$DESKTOP:$PLATFORM" in
            true:success:success|false:skipped:skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  mcp-probe:
    name: Real CLI MCP probe
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.check_macos_credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    concurrency:
      group: mcp-probe-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare managed-policy namespaces
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Probe real clients
        id: probe
        env:
          FOOM_PROBE_CLAUDE_VERSION: ${{ inputs.claude_version || 'latest' }}
          FOOM_PROBE_CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
          FOOM_PROBE_REPORT: ${{ runner.temp }}/mcp-probe-report.json
        run: node scripts/mcp-probe-ci.mjs
      - name: Report compatibility result
        if: always() && !cancelled()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FOOM_PROBE_REPORT: ${{ runner.temp }}/mcp-probe-report.json
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { reportIssue } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/mcp-probe-ci.mjs`);
            let report;
            try {
              report = JSON.parse(await readFile(process.env.FOOM_PROBE_REPORT, 'utf8'));
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
              report = ['claude', 'codex'].map(agent => ({
                agent, version: 'unavailable', assertion: 'startup', passed: false,
              }));
            }
            await reportIssue(github, context, report);


  # Credential rule: P12 contents and .p8 private key travel only through env or
  # mode-600 files in RUNNER_TEMP, removed by always() cleanup. Apple's required
  # argv interfaces may receive API key ID/issuer/key path, signing identity/team,
  # import password and random keychain password (including partition-list).
  # Secrets enter through step env, never interpolation into run text. The runner
  # is ephemeral and single-tenant. Mask generated passwords/derived identities;
  # never enable shell tracing, command echoing or credential debug output.
  macos-sign:
    name: Sign and notarize tested macOS ZIP and DMG
    needs: [changes, quality]
    if: >-
      needs.quality.result == 'success' && needs.changes.outputs.desktop_required == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly && !inputs.check_macos_credentials))
    runs-on: macos-15
    # Shared notarization deadline: 120 minutes in macos-sign.mjs, plus setup/signing/cleanup.
    timeout-minutes: 150
    environment: Release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: Foom-macos-15
          path: tested-macos
      - name: Import Release credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/macos-credentials.mjs setup
      - name: Sign, notarize, staple and verify the tested ZIP without rebuilding
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/macos-sign.mjs release tested-macos signed-macos
      - name: Delete temporary keychain and credential files
        if: always()
        run: node scripts/macos-credentials.mjs cleanup
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Foom-macos-signed
          path: signed-macos/
          if-no-files-found: error
          retention-days: 3

  macos-credentials:
    name: Check macOS Release credentials
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.check_macos_credentials
    runs-on: macos-15
    timeout-minutes: 10
    environment: Release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Import and confirm exactly one Developer ID identity for the team
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/macos-credentials.mjs setup
      - name: List notary submissions without building or uploading
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/macos-credentials.mjs check
      - name: Delete temporary keychain and credential files
        if: always()
        run: node scripts/macos-credentials.mjs cleanup

  nightly:
    name: Publish nightly
    needs: [changes, quality, macos-sign]
    if: >-
      needs.quality.result == 'success' && needs.macos-sign.result == 'success' &&
      needs.changes.outputs.desktop_required == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Download this run's tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name Foom-ubuntu-24.04 --name Foom-windows-2025 --name Foom-macos-signed --dir nightly-packages
      - name: Publish rolling prerelease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/nightly.mjs`);
            await publish({ github, context });
