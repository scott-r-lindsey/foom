name: CI

# Every pull request push, drafts included, validates Linux, Windows and macOS so
# platform failures surface while the work is in progress. A newer push cancels
# the branch's previous run. Nightly runs validate main only when it changed.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      claude_version:
        description: MCP probe Claude Code version (latest or stable x.y.z)
        type: string
        default: latest
      codex_version:
        description: MCP probe Codex version (latest or stable x.y.z)
        type: string
        default: latest
      publish_nightly:
        description: Publish tested main packages to the rolling nightly prerelease
        type: boolean
        default: false
      upload_packages:
        description: Upload unsigned development ZIPs (retained for 3 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Scheduled/manual runs have isolated groups so pushes cannot interrupt publication.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  HUSKY: '0'

jobs:
  # Desktop jobs need only this fast job, so they start alongside static checks.
  changes:
    name: Change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
      desktop_matrix: ${{ steps.changes.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Detect changes requiring desktop validation
        id: changes
        run: node scripts/ci-changes.mjs

  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run audit
      - run: pnpm run test:ci
      - name: Check committed whitespace
        run: git show --format= --check HEAD

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotePath=false diff --unified=0 --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > coverage/changed-lines.diff
          node scripts/report-changed-coverage.mjs coverage/lcov.info coverage/changed-lines.diff coverage/changed-lines.md
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node scripts/format-coverage-summary.mjs coverage/coverage-summary.json coverage/summary.md
          if [ -f coverage/changed-lines.md ]; then
            printf '\n' >> coverage/summary.md
            cat coverage/changed-lines.md >> coverage/summary.md
          fi
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR coverage comment
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('coverage/summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- foom-coverage -->';
            const body = fs.readFileSync('coverage/summary.md', 'utf8');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Electron (${{ matrix.os }}, ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    env:
      FOOM_ELECTRON_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron binary
        timeout-minutes: 3
        # Electron 44 can download lazily on require; keep network setup outside
        # the first Playwright launch deadline and the desktop test budget.
        run: node -e "require('electron')"
      - name: Prepare Windows PowerShell runtime
        if: runner.os == 'Windows' && startsWith(matrix.shard, '1/')
        timeout-minutes: 3
        # Run 37728101831: first native probe exhausted 8s; the next complete
        # policy/transport case took 5.4s. Warm runtime startup separately from
        # bounded hook/policy assertions, without retries or relaxed probe limits.
        run: powershell.exe -NoProfile -NonInteractive -Command "exit 0"
      - name: Test hooks and control storage with native OS tools
        if: startsWith(matrix.shard, '1/')
        # Cold PowerShell probes compete for startup when these files run together.
        # Exercise native transport once per platform, with one OS probe at a time.
        run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/hooks.xml --no-file-parallelism tests/unit/main/agents/hook-receiver.test.ts tests/unit/main/agents/hook-adapters.test.ts tests/unit/main/agents/agy-observer.test.ts tests/unit/main/agents/hook-launch.test.ts tests/unit/main/control/private-native.test.ts
      - name: Test Antigravity observer alone
        if: startsWith(matrix.shard, '1/')
        run: pnpm exec vitest run tests/unit/main/agents/agy-observer.test.ts --reporter=default --reporter=junit --outputFile.junit=test-results/agy-observer.xml
      - name: Test Git inventory paths on native filesystem
        if: startsWith(matrix.shard, '1/')
        run: pnpm exec vitest run --no-file-parallelism tests/unit/main/workspace/worktrees.test.ts tests/unit/main/workspace/inventory-watch.test.ts -t 'derives watch directories|validates paths'
      - name: Test preview containment on native filesystem
        if: startsWith(matrix.shard, '1/')
        # Windows junction tests must run on Windows, not just the Linux unit job.
        run: pnpm exec vitest run tests/unit/main/previews --reporter=default --reporter=junit --outputFile.junit=test-results/previews.xml
      - name: Prepare Linux display and sandbox
        timeout-minutes: 3
        if: runner.os == 'Linux'
        run: |
          # Hosted images usually already contain these. Avoid contacting a stale
          # mirror when nothing needs installing; bound network waits otherwise.
          missing=()
          for package in xvfb libgtk-3-0t64 libnss3 libasound2t64; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)" != "install ok installed" ]; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y "${missing[@]}"
          fi
          # Permit Chromium's user-namespace sandbox on this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The full suite runs as three disjoint named-test shards on every platform.
      # Per-test deadlines and the Electron worker watchdog still bound hangs.
      - name: Test Electron on Linux
        # Runs 38450424417/38456129505: all 46 shard-2 cases passed in
        # 350–352s, then build/cleanup exhausted six minutes. Run 38580547600:
        # two name-hash shards took 265s/412s and shard 2 exhausted seven
        # minutes; three shards project 272s/143s/262s from the same cases.
        # Keep the step timeout and per-test deadlines unchanged.
        timeout-minutes: 7
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run test:electron
      - name: Test Electron on macOS and Windows
        # Runs 38391083094–38419352620: macOS test cases total 742–840s;
        # three name-hash shards project 175–335s each, leaving runner headroom.
        # Runs 38406022244–38428051783: Windows two-shard median steps were
        # 423s/447s; three name-hash shards project median steps of 280–315s.
        # Keep the shared per-test deadline policy and worker watchdog.
        timeout-minutes: 10
        if: runner.os != 'Linux'
        run: pnpm run test:electron
      - name: Stamp nightly package version
        if: >-
          startsWith(matrix.shard, '1/') && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
        run: node scripts/nightly.mjs stamp
      - name: Package desktop application
        if: startsWith(matrix.shard, '1/')
        run: pnpm run make
      - name: Verify macOS ad-hoc signature after packaging and fuses
        if: runner.os == 'macOS' && startsWith(matrix.shard, '1/')
        run: codesign --verify --deep --strict out/Foom-darwin-arm64/Foom.app
      - name: Test packaged terminal host on Linux
        if: runner.os == 'Linux' && startsWith(matrix.shard, '1/')
        run: xvfb-run -a pnpm run test:packaged
      - name: Test packaged terminal host on macOS and Windows
        if: runner.os != 'Linux' && startsWith(matrix.shard, '1/')
        run: pnpm run test:packaged
      - name: Upload Electron timing and process diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: electron-results-${{ matrix.os }}-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: error
          retention-days: 3
      - name: Upload unsigned development package
        if: >-
          startsWith(matrix.shard, '1/') &&
          ((github.event_name == 'workflow_dispatch' && inputs.upload_packages) ||
          (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))))
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Foom-${{ matrix.os }}
          path: out/make/**/*.zip
          if-no-files-found: error
          retention-days: 3

  quality:
    name: Quality gate
    if: always()
    needs: [changes, checks, unit, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop_required }}
        run: |
          test "$CHANGES" = success
          test "$CHECKS" = success
          test "$UNIT" = success
          case "$DESKTOP_REQUIRED:$DESKTOP" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  mcp-probe:
    name: Real CLI MCP probe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    concurrency:
      group: mcp-probe-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare managed-policy namespaces
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Probe real clients
        id: probe
        env:
          FOOM_PROBE_CLAUDE_VERSION: ${{ inputs.claude_version || 'latest' }}
          FOOM_PROBE_CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
          FOOM_PROBE_REPORT: ${{ runner.temp }}/mcp-probe-report.json
        run: node scripts/mcp-probe-ci.mjs
      - name: Report compatibility result
        if: always() && !cancelled()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FOOM_PROBE_REPORT: ${{ runner.temp }}/mcp-probe-report.json
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { reportIssue } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/mcp-probe-ci.mjs`);
            let report;
            try {
              report = JSON.parse(await readFile(process.env.FOOM_PROBE_REPORT, 'utf8'));
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
              report = ['claude', 'codex'].map(agent => ({
                agent, version: 'unavailable', assertion: 'startup', passed: false,
              }));
            }
            await reportIssue(github, context, report);

  nightly:
    name: Publish nightly
    needs: [changes, quality]
    if: >-
      needs.quality.result == 'success' && needs.changes.outputs.desktop_required == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Download this run's tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name Foom-ubuntu-24.04 --name Foom-windows-2025 --name Foom-macos-15 --dir nightly-packages
      - name: Publish rolling prerelease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/nightly.mjs`);
            await publish({ github, context });
