name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_packages:
        description: Upload unsigned development ZIPs (retained for 3 days)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  checks:
    name: Static checks and change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop_required: ${{ steps.changes.outputs.desktop_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit
      - run: npm run test:ci
      - name: Detect changes requiring desktop validation
        id: changes
        run: node scripts/ci-changes.mjs
      - name: Check committed whitespace
        run: git show --format= --check HEAD

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c core.quotePath=false diff --unified=0 --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > coverage/changed-lines.diff
          node scripts/report-changed-coverage.mjs coverage/lcov.info coverage/changed-lines.diff coverage/changed-lines.md
      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node scripts/format-coverage-summary.mjs coverage/coverage-summary.json coverage/summary.md
          if [ -f coverage/changed-lines.md ]; then
            printf '\n' >> coverage/summary.md
            cat coverage/changed-lines.md >> coverage/summary.md
          fi
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR coverage comment
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('coverage/summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- foom-coverage -->';
            const body = fs.readFileSync('coverage/summary.md', 'utf8');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 3

  desktop:
    name: Electron (${{ matrix.os }})
    needs: [checks, unit]
    if: needs.checks.outputs.desktop_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test hook transport with native OS tools
        run: npx vitest run tests/unit/main/agents/hook-receiver.test.ts tests/unit/main/agents/hook-adapters.test.ts tests/unit/main/agents/hook-launch.test.ts
      - name: Prepare Linux display and sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
          # Permit Chromium's user-namespace sandbox on this ephemeral CI runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The full suite includes preflight and sidebar flows; per-test deadlines
      # and the Electron worker watchdog still bound individual hangs.
      - name: Test Electron on Linux
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
      - name: Test Electron on macOS and Windows
        # Windows can exceed five minutes across 39 tests on a busy runner.
        # Individual app launches retain the 60-second hard watchdog.
        timeout-minutes: 10
        if: runner.os != 'Linux'
        run: npm run test:electron
      - name: Repeat theme and teardown regressions
        if: runner.os != 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node --test --test-name-pattern='sidebar menus escape|persistent sidebar keeps Escape' tests/electron/app.test.js
          done
      - name: Package desktop application
        run: npm run make
      - name: Test packaged terminal host on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Test packaged terminal host on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Upload unsigned development package
        if: github.event_name == 'workflow_dispatch' && inputs.upload_packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: foom-${{ matrix.os }}
          path: out/make/**/*.zip
          if-no-files-found: error
          retention-days: 3

  quality:
    name: Quality gate
    if: always()
    needs: [checks, unit, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_REQUIRED: ${{ needs.checks.outputs.desktop_required }}
        run: |
          test "$CHECKS" = success
          test "$UNIT" = success
          case "$DESKTOP_REQUIRED:$DESKTOP" in
            true:success|false:skipped) exit 0 ;;
            *) exit 1 ;;
          esac
